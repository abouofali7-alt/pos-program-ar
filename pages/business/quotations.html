<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عروض الأسعار — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>
    <main class="pagewrap" style="padding:22px;max-width:1200px;margin:0 auto;">
        <div class="page-head">
            <div>
                <h2>عروض الأسعار</h2>
                <div class="sub">العروض المقدمة للعملاء قبل إصدار الفواتير</div>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary-soft" onclick="openQuoModal()"><i class="fa-solid fa-plus"></i> عرض سعر</button>
            </div>
        </div>
        <div class="table-card">
            <div class="table-head">عروض الأسعار</div>
            <div class="table-scroll">
                <table class="data-table">
                    <thead><tr><th>الرقم</th><th>التاريخ</th><th>العميل</th><th>الإجمالي</th><th>الحالة</th><th></th></tr></thead>
                    <tbody id="quoBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="quoModal" class="modal-mask" style="visibility:hidden;opacity:0;">
        <div class="modal-box" style="width:min(820px,94vw);">
            <h3>عرض سعر جديد</h3>
            <div class="form-grid">
                <div class="form-item"><label>التاريخ</label><input type="date" id="quoDate"></div>
                <div class="form-item"><label>العميل</label><select id="quoCustomer"></select></div>
                <div class="form-item"><label>الصلاحية حتى</label><input type="date" id="quoExpiry"></div>
                <div class="form-item"><label>الحالة</label>
                    <select id="quoStatus"><option value="open">مفتوح</option><option value="accepted">مقبول</option><option value="rejected">مرفوض</option><option value="cancelled">ملغى</option></select>
                </div>
                <div class="form-item" style="grid-column:1/-1;"><label>ملاحظة</label><input id="quoNote"></div>
            </div>
            <div style="margin-bottom:10px;"><button class="btn btn-sm" onclick="addQuoLine()"><i class="fa-solid fa-plus"></i> إضافة صنف</button></div>
            <div class="table-scroll" style="margin-bottom:12px;">
                <table class="data-table">
                    <thead><tr><th>المنتج</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th></th></tr></thead>
                    <tbody id="quoLinesBody"></tbody>
                </table>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                <span>الإجمالي: <b id="quoTotal">0.00</b></span>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn btn-secondary" onclick="closeQuoModal()">إلغاء</button>
                <button class="btn btn-primary-soft" onclick="saveQuo()">حفظ العرض</button>
            </div>
        </div>
    </div>

    <script src="../../js/ui.js"></script>
    <script src="../../js/db.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        let quoLineCount = 0;
        const quoStatusInfo = { open: ['badge-blue', 'مفتوح'], accepted: ['badge-green', 'مقبول'], rejected: ['badge-red', 'مرفوض'], cancelled: ['badge-amber', 'ملغى'] };

        async function load() {
            const [quotes, customers] = await Promise.all([ARDB.getAll('quotations'), ARDB.getAll('customers')]);
            const custById = {}; customers.forEach(c => custById[c.id] = c);
            const sorted = quotes.sort((a, b) => (b.date || 0) - (a.date || 0));
            document.getElementById('quoBody').innerHTML = sorted.map(q => {
                const si = quoStatusInfo[q.status] || quoStatusInfo.open;
                return '<tr><td class="num" style="font-weight:700;">' + q.number + '</td>' +
                    '<td>' + UI.date(q.date) + '</td>' +
                    '<td>' + (q.customerId && custById[q.customerId] ? custById[q.customerId].name : '—') + '</td>' +
                    '<td class="num" style="font-weight:700;">' + UI.money(q.total) + '</td>' +
                    '<td><span class="badge ' + si[0] + '">' + si[1] + '</span></td>' +
                    '<td style="text-align:left;white-space:nowrap;">' +
                    '<button class="btn btn-sm btn-primary-soft" title="تحويل لفاتورة بيع" onclick="convertToInvoice(' + q.id + ')"><i class="fa-solid fa-file-circle-check"></i> تحويل لفاتورة</button> ' +
                    '<button class="btn btn-sm" title="قبول العرض" onclick="setQuoStatus(' + q.id + ',\'accepted\')"><i class="fa-solid fa-check"></i></button> ' +
                    '<button class="btn btn-sm btn-danger" title="حذف" onclick="delQuo(' + q.id + ')"><i class="fa-solid fa-trash"></i></button></td></tr>';
            }).join('') || '<tr><td colspan="6" class="empty-state">لا توجد عروض أسعار</td></tr>';

            const sel = document.getElementById('quoCustomer');
            sel.innerHTML = '<option value="">— بدون عميل —</option>' + customers.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('');
        }

        async function addQuoLine() {
            const i = quoLineCount++;
            const products = await ARDB.getAll('products');
            const tr = document.createElement('tr');
            tr.innerHTML =
                '<td><select id="qProd_' + i + '" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);">' +
                '<option value="">— اختر —</option>' +
                products.map(p => '<option value="' + p.id + '" data-price="' + (p.price || 0) + '">' + p.name + '</option>').join('') + '</select></td>' +
                '<td><input id="qQty_' + i + '" type="number" step="1" min="0" value="1" style="width:70px;padding:8px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);" oninput="recalcQuo()"></td>' +
                '<td><input id="qPrice_' + i + '" type="number" step="0.01" min="0" style="width:90px;padding:8px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);" oninput="recalcQuo()"></td>' +
                '<td class="num" id="qSub_' + i + '" style="font-weight:700;">0.00</td>' +
                '<td><button class="btn btn-sm btn-danger" onclick="this.closest(\'tr\').remove();recalcQuo();"><i class="fa-solid fa-xmark"></i></button></td>';
            document.getElementById('quoLinesBody').appendChild(tr);
        }

        function recalcQuo() {
            let total = 0;
            document.querySelectorAll('#quoLinesBody tr').forEach(tr => {
                const sel = tr.querySelector('select[id^="qProd_"]');
                const qty = tr.querySelector('input[id^="qQty_"]');
                const price = tr.querySelector('input[id^="qPrice_"]');
                if (sel && price && qty) {
                    const oc = sel.options[sel.selectedIndex];
                    if (oc && oc.dataset.price && !price.value) price.value = oc.dataset.price;
                    const sub = (Number(qty.value) || 0) * (Number(price.value) || 0);
                    total += sub;
                    const subEl = tr.querySelector('[id^="qSub_"]');
                    if (subEl) subEl.textContent = Number(sub).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }
            });
            document.getElementById('quoTotal').textContent = total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function openQuoModal() {
            document.getElementById('quoModal').style.visibility = 'visible';
            document.getElementById('quoModal').style.opacity = '1';
            document.getElementById('quoDate').value = UI.todayInput();
            const expiry = new Date(); expiry.setDate(expiry.getDate() + 30);
            document.getElementById('quoExpiry').value = expiry.getFullYear() + '-' + String(expiry.getMonth() + 1).padStart(2, '0') + '-' + String(expiry.getDate()).padStart(2, '0');
            document.getElementById('quoStatus').value = 'open';
            document.getElementById('quoNote').value = '';
            document.getElementById('quoLinesBody').innerHTML = '';
            quoLineCount = 0;
            recalcQuo();
            await load();
        window.addEventListener('ar_cloud_data_updated', load);
        }
        function closeQuoModal() {
            document.getElementById('quoModal').style.visibility = 'hidden';
            document.getElementById('quoModal').style.opacity = '0';
        }

        async function saveQuo() {
            const date = new Date(document.getElementById('quoDate').value + 'T12:00:00').getTime();
            const customerId = document.getElementById('quoCustomer').value ? Number(document.getElementById('quoCustomer').value) : null;
            const expiry = document.getElementById('quoExpiry').value;
            const status = document.getElementById('quoStatus').value;
            const note = document.getElementById('quoNote').value.trim();
            const expiryTs = expiry ? new Date(expiry + 'T23:59:59').getTime() : null;

            const items = [];
            let total = 0;
            document.querySelectorAll('#quoLinesBody tr').forEach(tr => {
                const sel = tr.querySelector('select[id^="qProd_"]');
                const qty = tr.querySelector('input[id^="qQty_"]');
                const price = tr.querySelector('input[id^="qPrice_"]');
                if (sel) {
                    const pid = Number(sel.value);
                    if (pid) {
                        const q = Number(qty.value) || 0;
                        const p = Number(price.value) || 0;
                        if (q > 0) {
                            items.push({ productId: pid, quantity: q, price: p, total: q * p });
                            total += q * p;
                        }
                    }
                }
            });
            if (!items.length) { UI.toast('أضف صنفًا واحدًا على الأقل', 'warn'); return; }

            const number = await ARDB.nextSeq('quotation', 'QUO-', 6);
            await ARDB.add('quotations', { number, date, expiry: expiryTs, customerId, status, note, items, total, createdAt: Date.now() });
            UI.toast('تم حفظ العرض ' + number, 'ok');
            closeQuoModal(); load();
        }

        async function convertToInvoice(id) {
            const q = await ARDB.getById('quotations', id);
            if (!q) return;
            const ok = await UI.confirmBox('هل تريد تحويل عرض السعر ' + q.number + ' إلى فاتورة بيع فعلية؟');
            if (!ok) return;

            const invNumber = await ARDB.nextSeq('invoice', 'INV-', 6);
            await ARDB.add('invoices', {
                number: invNumber,
                date: Date.now(),
                customerId: q.customerId,
                items: q.items || [],
                total: q.total || 0,
                note: 'محولة من عرض السعر ' + q.number,
                createdAt: Date.now()
            });

            if (q.items) {
                for (const it of q.items) {
                    await ARDB.add('stockMovements', {
                        date: Date.now(),
                        productId: it.productId,
                        direction: 'out',
                        type: 'sale',
                        quantity: it.quantity || 1,
                        note: 'فاتورة ' + invNumber + ' (من عرض ' + q.number + ')'
                    });
                }
            }

            if (q.total > 0) {
                await ARDB.add('journalEntries', {
                    number: await ARDB.nextSeq('journalAuto', 'JRN-', 6),
                    date: Date.now(),
                    desc: 'فاتورة بيع ' + invNumber + ' (من عرض ' + q.number + ')',
                    lines: [
                        { accountId: 3, debit: q.total, credit: 0 },
                        { accountId: 11, debit: 0, credit: q.total }
                    ]
                });
            }

            q.status = 'accepted';
            await ARDB.put('quotations', q);

            UI.toast('تمت تحويل عرض السعر إلى الفاتورة ' + invNumber + ' بنجاح!', 'ok');
            load();
        }

        async function setQuoStatus(id, status) {
            const q = await ARDB.getById('quotations', id);
            if (!q) return;
            q.status = status;
            await ARDB.put('quotations', q);
            UI.toast('تم تحديث الحالة', 'ok'); load();
        }
        async function delQuo(id) {
            const ok = await UI.confirmBox('حذف عرض السعر؟');
            if (!ok) return;
            await ARDB.remove('quotations', id);
            UI.toast('تم الحذف', 'ok'); load();
        }
        load();
    </script>
</body>
</html>
