<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <script>
        try {
            var l = localStorage.getItem('ar_lang') || 'ar';
            document.documentElement.lang = l;
            document.documentElement.dir = (l === 'en') ? 'ltr' : 'rtl';
        } catch(e) {}
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقطة البيع (POS) الكاشير — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .pos-grid { display: grid; grid-template-columns: 1fr 380px; gap: 18px; height: calc(100vh - 110px); }
        .pos-products { display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
        .pos-cart { background: var(--card-dark); border: 1px solid var(--border-color); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; box-shadow: var(--shadow-card); }
        .prod-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 12px; overflow-y: auto; padding-inline-end: 4px; flex: 1; }
        .prod-item { background: var(--card-dark); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; cursor: pointer; transition: transform 0.2s, border-color 0.2s; text-align: center; }
        .prod-item:hover { transform: translateY(-2px); border-color: var(--accent-cyan); }
        .cart-items { flex: 1; overflow-y: auto; margin: 14px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 8px 0; }
        .cart-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); }
        @media print {
            html, body {
                width: 100% !important;
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
                color: #000 !important;
            }
            body > *:not(#thermalPrintArea) {
                display: none !important;
            }
            #thermalPrintArea {
                display: block !important;
                position: relative !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 2mm 3mm !important;
                box-sizing: border-box !important;
                background: #fff !important;
                color: #000 !important;
                font-family: 'Courier New', Tahoma, Arial, sans-serif !important;
                font-size: 13px !important;
                direction: rtl !important;
                text-align: right !important;
            }
            @page {
                size: auto;
                margin: 0mm;
            }
        }
        #thermalPrintArea {
            display: none;
        }
    </style>
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>

    <main class="pagewrap" style="padding:16px 22px;max-width:1400px;margin:0 auto;">
        <div class="page-head" style="margin-bottom:12px;">
            <div>
                <h2><i class="fa-solid fa-cash-register" style="color:var(--success);"></i> نقطة البيع (POS)</h2>
                <div class="sub">نظام الكاشير والمبيعات السريعة</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                <button class="btn btn-secondary" onclick="printThermalReceipt()" title="طباعة آخر إيصال حراري تم إصداره"><i class="fa-solid fa-print"></i> طباعة آخر إيصال</button>
                <button class="btn btn-secondary" onclick="syncPosData()" title="تحديث وسحب المنتجات والبيانات من السحابة"><i class="fa-solid fa-arrows-rotate"></i> تحديث المزامنة</button>
                <input id="barcodeSearch" placeholder="🔍 ابحث بالاسم أو الباركوود (أو امسح الباركوود مباشرة)..." style="padding:8px 14px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-dark);color:var(--text-primary);width:320px;" autofocus>
            </div>
        </div>

        <div class="pos-grid">
            <!-- قائمة المنتجات والتصنيفات -->
            <div class="pos-products">
                <div id="categoryTabs" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;">
                    <button class="btn btn-secondary active" onclick="filterCategory(null)" style="padding:6px 14px;font-size:0.85rem;">الكل</button>
                </div>
                <div class="prod-cards" id="productsGrid"></div>
            </div>

            <!-- سلة المبيعات والحساب -->
            <div class="pos-cart">
                <div style="display:flex;align-items:center;justify-content:space-between;font-weight:700;">
                    <span><i class="fa-solid fa-cart-shopping" style="color:var(--accent-cyan);"></i> الفاتورة الحالية</span>
                    <button class="btn btn-secondary" onclick="clearCart()" style="padding:4px 8px;font-size:0.75rem;color:var(--danger);"><i class="fa-solid fa-trash-can"></i> تفريغ</button>
                </div>

                <div style="margin:10px 0;">
                    <label style="font-size:0.8rem;color:var(--text-secondary);display:block;margin-bottom:4px;">العميل:</label>
                    <select id="posCustomer" onchange="onPosCustomerChange()" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-dark);color:var(--text-primary);"></select>
                    <button id="posLocBtn" type="button" class="btn btn-secondary" onclick="pickPOSLocation()" style="width:100%;margin-top:6px;font-size:0.8rem;padding:6px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;">
                        <i class="fa-solid fa-location-dot" style="color:var(--accent-cyan);"></i> <span id="posLocText">تحديد موقع الفاتورة / التسليم (GPS)</span>
                    </button>
                </div>

                <div class="cart-items" id="cartItems">
                    <div style="text-align:center;padding:40px 0;color:var(--text-secondary);font-size:0.9rem;">السلة فارغة، انقر على المنتجات لإضافتها</div>
                </div>

                <div style="display:flex;flex-direction:column;gap:8px;font-size:0.95rem;">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <span>المجموع الفرعي:</span>
                        <b id="subTotal">0.00 ج.م</b>
                    </div>

                    <!-- قسم الخصم -->
                    <div style="background:rgba(255,255,255,0.03);border:1px dashed var(--border-color);border-radius:10px;padding:8px 12px;margin:2px 0;">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                            <span style="font-size:0.82rem;font-weight:600;color:var(--text-secondary);"><i class="fa-solid fa-tags" style="color:var(--warning);"></i> تطبيق الخصم:</span>
                            <div style="display:flex;gap:4px;">
                                <button type="button" id="btnDiscFixed" class="btn btn-sm btn-primary-soft" onclick="setDiscountType('fixed')" style="padding:2px 8px;font-size:0.75rem;">مبلغ</button>
                                <button type="button" id="btnDiscPercent" class="btn btn-sm btn-secondary" onclick="setDiscountType('percent')" style="padding:2px 8px;font-size:0.75rem;">% نسبة</button>
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <input id="discountInput" type="number" min="0" step="any" placeholder="0" oninput="renderCart()" style="flex:1;padding:6px 10px;border-radius:6px;border:1px solid var(--border-color);background:var(--card-dark);color:var(--text-primary);font-size:0.9rem;font-weight:700;outline:none;">
                            <span id="discountTypeUnit" style="font-size:0.8rem;color:var(--text-secondary);min-width:30px;text-align:center;">ج.م</span>
                        </div>
                        <div id="discountAmountRow" style="display:flex;justify-content:space-between;font-size:0.8rem;color:var(--warning);margin-top:6px;display:none;">
                            <span>قيمة الخصم:</span>
                            <b id="discountAmountText">-0.00 ج.م</b>
                        </div>
                    </div>

                    <div style="display:flex;justify-content:space-between;color:var(--success);font-size:1.2rem;font-weight:700;margin-top:4px;border-top:1px solid var(--border-color);padding-top:8px;">
                        <span>الإجمالي المستحق:</span>
                        <span id="grandTotal">0.00 ج.م</span>
                    </div>
                    <button class="btn btn-primary-soft" onclick="checkout()" style="width:100%;padding:12px;font-size:1.05rem;margin-top:6px;"><i class="fa-solid fa-print"></i> إتمام الدفع وطباعة الفاتورة</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/ui.js"></script>
    <script src="../../js/db.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        let _allProducts = [];
        let _categories = [];
        let _customers = [];
        let _cart = [];
        let _selectedCat = null;
        let _posLocation = null;
        let _saleType = 'retail';
        let _discountType = 'fixed';
        let _companySettings = {};

        async function loadCompanySettings() {
            try {
                const rows = (await ARDB.getAll('settings')) || [];
                const map = {};
                rows.forEach(r => { if (r && r.key) map[r.key] = r.value; });
                _companySettings = {
                    name: map.companyName || 'AR-Program',
                    phone: map.companyPhone || '',
                    address: map.companyAddress || '',
                    taxNo: map.taxNo || '',
                    note: map.invoiceNote || 'شكراً لزيارتكم وسعداء بملء ثقتكم!'
                };
            } catch(e) {
                _companySettings = { name: 'AR-Program', phone: '', address: '', taxNo: '', note: 'شكراً لزيارتكم!' };
            }
        }

        function setDiscountType(type) {
            _discountType = type;
            const btnFixed = document.getElementById('btnDiscFixed');
            const btnPercent = document.getElementById('btnDiscPercent');
            const unit = document.getElementById('discountTypeUnit');
            if (type === 'percent') {
                if (btnFixed) btnFixed.className = 'btn btn-sm btn-secondary';
                if (btnPercent) btnPercent.className = 'btn btn-sm btn-primary-soft';
                if (unit) unit.textContent = '%';
            } else {
                if (btnFixed) btnFixed.className = 'btn btn-sm btn-primary-soft';
                if (btnPercent) btnPercent.className = 'btn btn-sm btn-secondary';
                if (unit) unit.textContent = 'ج.م';
            }
            renderCart();
        }

        function editItemPrice(prodId) {
            const item = _cart.find(c => String(c.productId) === String(prodId));
            if (!item) return;
            const newPriceStr = prompt(`تعديل سعر الوحدة للمنتج (${item.productName}):`, item.price);
            if (newPriceStr === null) return;
            const newPrice = parseFloat(newPriceStr);
            if (!isNaN(newPrice) && newPrice >= 0) {
                item.price = newPrice;
                renderCart();
                UI.toast('تم تحديث سعر المنتج بالسلة', 'ok');
            }
        }

        function getCartTotals() {
            const subTotal = _cart.reduce((s, item) => s + (item.price * item.quantity), 0);
            const discInput = document.getElementById('discountInput');
            let rawVal = parseFloat(discInput ? discInput.value : 0) || 0;
            if (rawVal < 0) rawVal = 0;

            let discountAmount = 0;
            if (_discountType === 'percent') {
                discountAmount = (subTotal * rawVal) / 100;
            } else {
                discountAmount = rawVal;
            }

            if (discountAmount > subTotal) {
                discountAmount = subTotal;
            }

            const grandTotal = Math.max(0, subTotal - discountAmount);
            return { subTotal, discountType: _discountType, discountValue: rawVal, discountAmount, grandTotal };
        }

        function getProdPrice(prod) {
            if (!prod) return 0;
            if (_saleType === 'wholesale') {
                return prod.wholesalePrice || prod.price || 0;
            }
            return prod.price || 0;
        }

        function setSaleType(type) {
            _saleType = type;
            const btnR = document.getElementById('btnSaleRetail');
            const btnW = document.getElementById('btnSaleWholesale');
            if (type === 'wholesale') {
                if (btnR) btnR.className = 'btn btn-sm btn-secondary';
                if (btnW) btnW.className = 'btn btn-sm btn-primary-soft';
            } else {
                if (btnR) btnR.className = 'btn btn-sm btn-primary-soft';
                if (btnW) btnW.className = 'btn btn-sm btn-secondary';
            }
            _cart.forEach(item => {
                const prod = _allProducts.find(p => String(p.id) === String(item.productId));
                if (prod) item.price = getProdPrice(prod);
            });
            renderCart();
            renderProducts(document.getElementById('barcodeSearch') ? document.getElementById('barcodeSearch').value.trim().toLowerCase() : '');
        }

        async function syncPosData() {
            UI.toast('جاري تجميع وتحديث المنتجات من السحابة...', 'info');
            if (typeof API !== 'undefined') {
                await API.pullCloudSync(true);
                await API.pushFullDataToCloud();
            }
            await initPOS();
            UI.toast('تمت تحديث المنتجات والمزامنة بنجاح!', 'ok');
        }

        async function initPOS() {
            await loadCompanySettings();
            _allProducts = (await ARDB.getAll('products')) || [];
            _categories = (await ARDB.getAll('categories')) || [];
            _customers = (await ARDB.getAll('customers')) || [];
            
            const custSel = document.getElementById('posCustomer');
            if (custSel) {
                const curVal = custSel.value;
                custSel.innerHTML = '<option value="">— عميل عام —</option>' + _customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                if (curVal) custSel.value = curVal;
            }

            renderCategories();
            renderProducts();

            const bInput = document.getElementById('barcodeSearch');
            if (bInput && !bInput._hasListener) {
                bInput._hasListener = true;
                bInput.addEventListener('input', (e) => {
                    const q = e.target.value.trim().toLowerCase();
                    renderProducts(q);
                });
                bInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const q = e.target.value.trim().toLowerCase();
                        if (!q) return;
                        const match = _allProducts.find(p => p && ((p.barcode && String(p.barcode).toLowerCase() === q) || (p.name && String(p.name).toLowerCase() === q)));
                        if (match) {
                            addToCart(match.id);
                            e.target.value = '';
                            renderProducts('');
                            UI.toast('تمت إضافة المنتج للسلة: ' + match.name, 'ok');
                        } else {
                            UI.toast('لم يتم العثور على صنف بالباركود: ' + q, 'warn');
                        }
                    }
                });
            }
        }

        function onPosCustomerChange() {
            const cid = document.getElementById('posCustomer') ? document.getElementById('posCustomer').value : '';
            if (cid) {
                const cust = _customers.find(c => String(c.id) === String(cid));
                if (cust && (cust.lat || cust.address)) {
                    _posLocation = { lat: cust.lat, lng: cust.lng, address: cust.address };
                    updatePosLocText();
                }
            } else {
                _posLocation = null;
                updatePosLocText();
            }
        }

        function pickPOSLocation() {
            if (typeof ARLocation !== 'undefined') {
                ARLocation.openMapModal(_posLocation, (res) => {
                    if (res) {
                        _posLocation = res;
                        updatePosLocText();
                        UI.toast('تم تحديد موقع الفاتورة / الكاشير', 'ok');
                    }
                });
            } else {
                UI.toast('تعذر تحميل الخريطة', 'warn');
            }
        }

        function updatePosLocText() {
            const txt = document.getElementById('posLocText');
            if (!txt) return;
            if (_posLocation && (_posLocation.address || _posLocation.lat)) {
                const desc = _posLocation.address ? _posLocation.address.slice(0, 22) + '...' : `${_posLocation.lat}, ${_posLocation.lng}`;
                txt.innerHTML = `<span style="color:var(--success);"><i class="fa-solid fa-location-check"></i> ${desc}</span>`;
            } else {
                txt.textContent = 'تحديد موقع الفاتورة / التسليم (GPS)';
            }
        }

        function renderCategories() {
            const tabs = document.getElementById('categoryTabs');
            if (!tabs) return;
            let html = `<button class="btn btn-secondary ${!_selectedCat ? 'active' : ''}" onclick="filterCategory(null)" style="padding:6px 14px;font-size:0.85rem;">الكل</button>`;
            _categories.forEach(c => {
                const activeClass = String(_selectedCat) === String(c.id) ? 'active' : '';
                html += `<button class="btn btn-secondary ${activeClass}" onclick="filterCategory('${c.id}')" style="padding:6px 14px;font-size:0.85rem;">${c.name}</button>`;
            });
            tabs.innerHTML = html;
        }

        function filterCategory(catId) {
            _selectedCat = catId;
            renderCategories();
            renderProducts();
        }

        function renderProducts(query = '') {
            const grid = document.getElementById('productsGrid');
            if (!grid) return;
            let filtered = _allProducts;
            if (_selectedCat) {
                filtered = filtered.filter(p => p && p.categoryId != null && String(p.categoryId) === String(_selectedCat));
            }
            if (query) {
                filtered = filtered.filter(p => (p.name && p.name.toLowerCase().includes(query)) || (p.barcode && String(p.barcode).includes(query)));
            }

            if (!filtered.length) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-secondary);">لا توجد منتجات مطابقة</div>';
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="prod-item" onclick="addToCart('${p.id}')">
                    <div style="font-size:1.5rem;margin-bottom:6px;color:var(--accent-cyan);"><i class="fa-solid fa-box"></i></div>
                    <div style="font-weight:600;font-size:0.85rem;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.name}</div>
                    <div style="color:var(--success);font-weight:700;font-size:0.9rem;">${UI.money(getProdPrice(p))}</div>
                </div>
            `).join('');
        }

        async function addToCart(prodId) {
            const prod = _allProducts.find(p => String(p.id) === String(prodId));
            if (!prod) return;

            let existing = _cart.find(c => String(c.productId) === String(prodId));

            if (prod.hasSerials) {
                const allSerials = await ARDB.getAll('serials');
                const avail = (allSerials || []).filter(s => String(s.productId) === String(prodId) && s.status === 'available');
                
                const usedSerialIds = _cart.flatMap(c => c.serialIds || []);
                const unselectedAvail = avail.filter(s => !usedSerialIds.includes(s.id));

                if (!unselectedAvail.length) {
                    UI.toast('لا توجد سريالات إضافية متاحة في المخزن لهذا المنتج!', 'warn');
                    return;
                }
                
                let sOptions = unselectedAvail.map(s => s.serialNumber).join('\n');
                let pick = prompt('أدخل الرقم التسلسلي (S/N) للقطعة أو اختر من المتاح:\n' + sOptions, unselectedAvail[0].serialNumber);
                if (!pick) return;
                pick = pick.trim();

                const matched = unselectedAvail.find(s => s.serialNumber.toLowerCase() === pick.toLowerCase());
                if (!matched) {
                    UI.toast('الرقم التسلسلي غير موجود أو غير متاح!', 'error');
                    return;
                }

                if (existing) {
                    existing.quantity += 1;
                    existing.serialIds.push(matched.id);
                    existing.serials.push(matched.serialNumber);
                    existing.price = getProdPrice(prod);
                } else {
                    _cart.push({
                        productId: prod.id,
                        productName: prod.name,
                        price: getProdPrice(prod),
                        quantity: 1,
                        serialIds: [matched.id],
                        serials: [matched.serialNumber]
                    });
                }
            } else {
                if (existing) {
                    existing.quantity += 1;
                    existing.price = getProdPrice(prod);
                } else {
                    _cart.push({
                        productId: prod.id,
                        productName: prod.name,
                        price: getProdPrice(prod),
                        quantity: 1,
                        serialIds: [],
                        serials: []
                    });
                }
            }
            renderCart();
        }

        function updateQty(prodId, delta) {
            const item = _cart.find(c => String(c.productId) === String(prodId));
            if (!item) return;

            if (delta > 0) {
                const prod = _allProducts.find(p => String(p.id) === String(prodId));
                if (prod && prod.hasSerials) {
                    addToCart(prodId);
                    return;
                }
                item.quantity += 1;
            } else {
                item.quantity -= 1;
                if (item.serials && item.serials.length) {
                    item.serialIds.pop();
                    item.serials.pop();
                }
                if (item.quantity <= 0) {
                    _cart = _cart.filter(c => c !== item);
                }
            }
            renderCart();
        }

        function clearCart() {
            _cart = [];
            const discInput = document.getElementById('discountInput');
            if (discInput) discInput.value = '';
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            if (!_cart.length) {
                container.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--text-secondary);font-size:0.9rem;">السلة فارغة، انقر على المنتجات لإضافتها</div>';
                document.getElementById('subTotal').innerHTML = '0.00 ج.م';
                document.getElementById('grandTotal').innerHTML = '0.00 ج.م';
                const discRow = document.getElementById('discountAmountRow');
                if (discRow) discRow.style.display = 'none';
                return;
            }

            const { subTotal, discountAmount, grandTotal } = getCartTotals();

            container.innerHTML = _cart.map((item) => {
                const itemTotal = item.price * item.quantity;
                const serialsTag = (item.serials && item.serials.length)
                    ? `<div style="font-size:0.75rem;color:var(--accent-purple);margin-top:2px;"><i class="fa-solid fa-barcode"></i> S/N: ${item.serials.join(', ')}</div>`
                    : '';
                return `
                    <div class="cart-row" style="padding:10px 0;border-bottom:1px solid var(--border-color);">
                        <div style="flex:1;">
                            <div style="font-weight:600;font-size:0.88rem;color:var(--text-primary);">${item.productName}</div>
                            ${serialsTag}
                            <div style="font-size:0.75rem;color:var(--text-secondary);margin-top:2px;">
                                ${UI.money(item.price)} × ${item.quantity}
                                <button onclick="editItemPrice('${item.productId}')" class="btn btn-sm btn-secondary" style="padding:1px 5px;font-size:0.68rem;margin-inline-start:4px;" title="تعديل السعر/خصم خاص للصنف"><i class="fa-solid fa-pen"></i></button>
                            </div>
                        </div>
                        <div style="display:flex;align-items:center;gap:6px;">
                            <button onclick="updateQty('${item.productId}', -1)" class="icon-btn" style="width:24px;height:24px;">-</button>
                            <span style="font-size:0.85rem;font-weight:700;min-width:18px;text-align:center;">${item.quantity}</span>
                            <button onclick="updateQty('${item.productId}', 1)" class="icon-btn" style="width:24px;height:24px;">+</button>
                            <b style="min-width:65px;text-align:left;font-size:0.85rem;color:var(--success);">${UI.money(itemTotal)}</b>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('subTotal').innerHTML = UI.money(subTotal) + ' ج.م';
            
            const discRow = document.getElementById('discountAmountRow');
            const discText = document.getElementById('discountAmountText');
            if (discountAmount > 0) {
                if (discRow) discRow.style.display = 'flex';
                if (discText) discText.innerHTML = '-' + UI.money(discountAmount) + ' ج.م';
            } else {
                if (discRow) discRow.style.display = 'none';
            }

            document.getElementById('grandTotal').innerHTML = UI.money(grandTotal) + ' ج.م';
        }

        async function checkout() {
            if (!_cart.length) return UI.toast('السلة فارغة!', 'warn');
            const { subTotal, discountType, discountValue, discountAmount, grandTotal } = getCartTotals();

            if (typeof ARPayments !== 'undefined') {
                ARPayments.openCheckoutModal(grandTotal, async (payRes) => {
                    if (payRes && payRes.status === 'success') {
                        await finalizeInvoice(subTotal, discountType, discountValue, discountAmount, grandTotal, payRes);
                    }
                });
            } else {
                await finalizeInvoice(subTotal, discountType, discountValue, discountAmount, grandTotal, {
                    method: 'cash',
                    payments: [{ method: 'cash', amount: grandTotal, label: 'نقداً (كاش)' }]
                });
            }
        }

        async function finalizeInvoice(subTotal, discountType, discountValue, discountAmount, grandTotal, payRes) {
            const invNumber = await ARDB.nextSeq('invoice_seq', 'POS-', 5);
            const customerIdVal = document.getElementById('posCustomer') ? document.getElementById('posCustomer').value : '';
            const customerId = customerIdVal ? customerIdVal : null;
            
            const payments = (payRes && payRes.payments && payRes.payments.length)
                ? payRes.payments
                : [{ method: (typeof payRes === 'string' ? payRes : (payRes && payRes.method ? payRes.method : 'cash')), amount: grandTotal, label: 'كاش' }];

            const payMethodSummary = payments.map(p => {
                const mObj = typeof ARPayments !== 'undefined' ? ARPayments.METHODS.find(m => m.id === p.method) : null;
                const lbl = mObj ? mObj.label : (p.label || p.method);
                return `${lbl}: ${p.amount} ج.م`;
            }).join(' + ');

            const isCredit = payments.some(p => p.method === 'bnpl' || p.method === 'credit');

            const invItems = _cart.map(c => {
                const prod = _allProducts.find(p => String(p.id) === String(c.productId));
                return {
                    productId: c.productId,
                    name: c.productName,
                    quantity: c.quantity,
                    price: c.price,
                    cost: prod ? (prod.cost || 0) : 0,
                    total: c.price * c.quantity,
                    serialIds: c.serialIds || [],
                    serials: c.serials || []
                };
            });

            const invoice = {
                number: invNumber,
                date: Date.now(),
                customerId: customerId,
                subtotal: subTotal,
                discountType: discountType,
                discountValue: discountValue,
                discount: discountAmount,
                total: grandTotal,
                items: invItems,
                payments: payments,
                paymentMethod: payMethodSummary,
                paymentType: isCredit ? 'credit' : 'cash',
                saleType: _saleType,
                location: _posLocation,
                type: 'pos'
            };
            const invId = await ARDB.add('invoices', invoice);
            
            for (const item of invItems) {
                if (item.serialIds && item.serialIds.length) {
                    for (const sid of item.serialIds) {
                        await ARDB.update('serials', sid, { status: 'sold', invoiceId: invId, invoiceDate: Date.now() });
                    }
                }
            }

            for (const item of invItems) {
                await ARDB.add('stockMovements', {
                    date: Date.now(),
                    productId: item.productId,
                    direction: 'out',
                    type: 'pos',
                    quantity: item.quantity || 1,
                    note: 'بيع كاشير POS ' + invNumber
                });
            }

            if (grandTotal > 0) {
                const journalLines = [];
                payments.forEach(p => {
                    if (p.amount > 0) {
                        const accId = (p.method === 'bnpl' || p.method === 'credit') ? 4 : 3;
                        journalLines.push({ accountId: accId, debit: p.amount, credit: 0 });
                    }
                });
                journalLines.push({ accountId: 11, debit: 0, credit: grandTotal });

                await ARDB.add('journalEntries', {
                    number: await ARDB.nextSeq('journalAuto', 'JRN-', 6),
                    date: Date.now(),
                    desc: 'مبيعات كاشير POS ' + invNumber + ' (' + payMethodSummary + ')',
                    lines: journalLines
                });

                if (customerId) {
                    const cashPaidAmt = payments.filter(p => p.method !== 'bnpl' && p.method !== 'credit').reduce((s, p) => s + (p.amount || 0), 0);
                    if (cashPaidAmt > 0) {
                        await ARDB.add('payments', {
                            date: Date.now(),
                            type: 'receipt',
                            partyType: 'customer',
                            partyId: customerId,
                            amount: cashPaidAmt,
                            method: 'cash',
                            note: 'تحصيل كاشير فاتورة ' + invNumber
                        });
                    }
                }
            }

            if (typeof ARAudit !== 'undefined') {
                ARAudit.logAction('إصدار فاتورة POS', 'المبيعات', `فاتورة رقم ${invNumber} بقيمة ${grandTotal} (خصم: ${discountAmount}) عبر ${payMethodSummary}`);
            }

            UI.toast('تم حفظ وإتمام الفاتورة رقم: ' + invNumber, 'ok');

            const curUser = (typeof getStoredUser === 'function') ? getStoredUser() : null;
            const cashierName = curUser ? (curUser.name || curUser.username || 'الكاشير') : 'الكاشير';
            const custObj = customerId ? _customers.find(c => String(c.id) === String(customerId)) : null;
            const customerName = custObj ? custObj.name : 'عميل عام (نقدي)';
            const customerPhone = custObj && custObj.phone ? custObj.phone : '';
            const customerAddress = custObj && custObj.address ? custObj.address : '';
            const invDateObj = new Date();
            const invDateStr = invDateObj.toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' });
            const invTimeStr = invDateObj.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const paidTotal = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
            const remainingBalance = Math.max(0, paidTotal - grandTotal);

            const payDetailsRows = payments.map(p => {
                const mObj = typeof ARPayments !== 'undefined' ? ARPayments.METHODS.find(m => m.id === p.method) : null;
                const lbl = mObj ? mObj.label : (p.label || p.method);
                return `<tr><td style="padding:2px 0;">${lbl}:</td><td style="text-align:left;font-weight:bold;padding:2px 0;">${Number(p.amount || 0).toFixed(2)} ج.م</td></tr>`;
            }).join('');

            const receiptHtml = `
                <div style="font-family:'Courier New', Tahoma, Arial, sans-serif;font-size:13px;color:#000;line-height:1.4;direction:rtl;text-align:right;width:100%;box-sizing:border-box;background:#fff;padding:2px;">
                    <!-- الترويسة الرئيسية للمحل/الشركة -->
                    <div style="text-align:center;padding-bottom:6px;margin-bottom:6px;border-bottom:1px dashed #000;">
                        <div style="font-size:18px;font-weight:bold;margin-bottom:3px;">${_companySettings.name || 'AR-Program'}</div>
                        ${_companySettings.address ? `<div style="font-size:11.5px;margin-bottom:2px;">📍 ${_companySettings.address}</div>` : ''}
                        ${_companySettings.phone ? `<div style="font-size:11.5px;margin-bottom:2px;">📞 ${_companySettings.phone}</div>` : ''}
                        ${_companySettings.taxNo ? `<div style="font-size:11.5px;margin-bottom:2px;">الرقم الضريبي: ${_companySettings.taxNo}</div>` : ''}
                        <div style="font-size:13.5px;font-weight:bold;margin-top:6px;background:#eee;padding:4px 0;border-radius:3px;">إيصال مبيعات كاشير (POS)</div>
                    </div>

                    <!-- تفاصيل الفاتورة -->
                    <table style="width:100%;font-size:11.5px;margin-bottom:6px;">
                        <tr>
                            <td><b>رقم الفاتورة:</b> ${invNumber}</td>
                            <td style="text-align:left;"><b>التاريخ:</b> ${invDateStr}</td>
                        </tr>
                        <tr>
                            <td><b>الكاشير:</b> ${cashierName}</td>
                            <td style="text-align:left;"><b>الوقت:</b> ${invTimeStr}</td>
                        </tr>
                        <tr>
                            <td colspan="2"><b>العميل:</b> ${customerName} ${customerPhone ? '(' + customerPhone + ')' : ''}</td>
                        </tr>
                        ${customerAddress ? `<tr><td colspan="2"><b>العنوان:</b> ${customerAddress}</td></tr>` : ''}
                    </table>

                    <div style="border-top:1px dashed #000;margin:6px 0;"></div>

                    <!-- جدول الأصناف -->
                    <table style="width:100%;font-size:12.5px;border-collapse:collapse;margin-bottom:6px;">
                        <thead>
                            <tr style="border-bottom:1px solid #000;">
                                <th style="text-align:right;padding:4px 0;width:45%;">الصنف</th>
                                <th style="text-align:center;padding:4px 0;width:30%;">ك × سعر</th>
                                <th style="text-align:left;padding:4px 0;width:25%;">الإجمالي</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${invItems.map(c => `
                                <tr style="border-bottom:1px dashed #eee;">
                                    <td style="padding:4px 0;vertical-align:top;">
                                        <div style="font-weight:bold;font-size:13px;">${c.name}</div>
                                        ${(c.serials && c.serials.length) ? `<div style="font-size:10.5px;color:#222;margin-top:1px;">S/N: ${c.serials.join(', ')}</div>` : ''}
                                    </td>
                                    <td style="text-align:center;padding:4px 0;vertical-align:top;font-size:12.5px;">${c.quantity} × ${c.price.toFixed(2)}</td>
                                    <td style="text-align:left;font-weight:bold;padding:4px 0;vertical-align:top;font-size:13px;">${c.total.toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <div style="border-top:1px dashed #000;margin:6px 0;"></div>

                    <!-- الملخص المالي والخصم -->
                    <table style="width:100%;font-size:12.5px;margin-bottom:6px;">
                        <tr>
                            <td style="padding:2px 0;">المجموع الفرعي:</td>
                            <td style="text-align:left;font-weight:bold;padding:2px 0;">${subTotal.toFixed(2)} ج.م</td>
                        </tr>
                        ${discountAmount > 0 ? `
                        <tr style="color:#d97706;">
                            <td style="padding:2px 0;">الخصم المطبق ${discountType === 'percent' ? '(' + discountValue + '%)' : ''}:</td>
                            <td style="text-align:left;font-weight:bold;padding:2px 0;">-${discountAmount.toFixed(2)} ج.م</td>
                        </tr>
                        ` : ''}
                        <tr style="font-size:17px;font-weight:bold;border-top:1.5px solid #000;border-bottom:2px double #000;">
                            <td style="padding:6px 0;">الإجمالي النهائي:</td>
                            <td style="text-align:left;padding:6px 0;">${grandTotal.toFixed(2)} ج.م</td>
                        </tr>
                    </table>

                    <!-- تفاصيل وطريقة السداد -->
                    <div style="margin-top:6px;font-size:11.5px;background:#fafafa;padding:6px;border-radius:4px;border:1px solid #eee;">
                        <div style="font-weight:bold;margin-bottom:4px;border-bottom:1px solid #ddd;padding-bottom:2px;">تفاصيل الدفع:</div>
                        <table style="width:100%;">
                            ${payDetailsRows}
                            ${paidTotal > grandTotal ? `
                            <tr style="border-top:1px dashed #ccc;font-weight:bold;">
                                <td style="padding-top:3px;">المبلغ الباقي للعميل:</td>
                                <td style="text-align:left;padding-top:3px;">${remainingBalance.toFixed(2)} ج.م</td>
                            </tr>
                            ` : ''}
                        </table>
                    </div>

                    <!-- تذييل الفاتورة والسياسات والباركوود -->
                    <div style="text-align:center;font-size:11.5px;margin-top:10px;padding-top:6px;border-top:1px dashed #000;">
                        <div style="margin-bottom:4px;font-weight:bold;font-size:12.5px;">${_companySettings.note || 'شكراً لزيارتكم وسعداء بملء ثقتكم!'}</div>
                        <div style="font-size:10.5px;color:#444;">الاسترجاع والاستبدال خلال 14 يوماً بموجب الفاتورة الأصلية</div>
                        <div style="font-family:monospace;font-size:15px;letter-spacing:2px;margin-top:6px;font-weight:bold;">||||| | ||||| |||||| |||</div>
                        <div style="font-family:monospace;font-size:12px;font-weight:bold;margin-top:1px;">* ${invNumber} *</div>
                    </div>
                </div>
            `;

            printThermalReceipt(receiptHtml);
            showReceiptPreviewModal(invNumber, receiptHtml);
            clearCart();
        }

        let _lastReceiptHtml = '';

        function printThermalReceipt(htmlContent) {
            if (htmlContent) _lastReceiptHtml = htmlContent;
            const targetHtml = htmlContent || _lastReceiptHtml;
            if (!targetHtml) {
                UI.toast('لا يوجد إيصال سابق للطباعة', 'warn');
                return;
            }

            const area = document.getElementById('thermalPrintArea');
            if (area) {
                area.innerHTML = targetHtml;
            }

            setTimeout(() => {
                try {
                    window.print();
                } catch(e) {
                    console.warn('window.print error, trying popup fallback...', e);
                    printThermalReceiptPopup(targetHtml);
                }
            }, 150);
        }

        function printThermalReceiptPopup(htmlContent) {
            if (htmlContent) _lastReceiptHtml = htmlContent;
            const targetHtml = htmlContent || _lastReceiptHtml;
            if (!targetHtml) {
                UI.toast('لا يوجد إيصال سابق للطباعة', 'warn');
                return;
            }

            const win = window.open('', '_blank', 'width=380,height=650,left=100,top=100');
            if (!win) {
                UI.toast('يرجى السماح بالنوافذ المنبثقة للطباعة', 'warn');
                return;
            }

            win.document.write(`
                <!DOCTYPE html>
                <html lang="ar" dir="rtl">
                <head>
                    <meta charset="utf-8">
                    <title>طباعة إيصال حراري</title>
                    <style>
                        @page { size: 80mm auto; margin: 0mm; }
                        body {
                            margin: 0;
                            padding: 3mm;
                            font-family: 'Courier New', Tahoma, Arial, sans-serif;
                            font-size: 13px;
                            background: #fff;
                            color: #000;
                            direction: rtl;
                            text-align: right;
                        }
                        @media print {
                            body { padding: 1mm; }
                        }
                    </style>
                </head>
                <body>
                    ${targetHtml}
                    <script>
                        window.onload = function() {
                            setTimeout(function() {
                                window.focus();
                                window.print();
                            }, 250);
                        };
                    <\/script>
                </body>
                </html>
            `);
            win.document.close();
        }

        function showReceiptPreviewModal(invNumber, receiptHtml) {
            let modal = document.getElementById('posReceiptModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'posReceiptModal';
                modal.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,0.85);z-index:99999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:15px;';
                document.body.appendChild(modal);
            }

            modal.innerHTML = `
                <div style="background:var(--card-dark);border:1px solid var(--border-color);border-radius:14px;width:min(480px,96vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-card);overflow:hidden;animation:fadeIn 0.2s;">
                    <div style="padding:14px 18px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.02);">
                        <b style="font-size:1.05rem;color:var(--success);"><i class="fa-solid fa-circle-check"></i> تم إتمام الفاتورة (${invNumber})</b>
                        <button onclick="document.getElementById('posReceiptModal').style.display='none'" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div style="flex:1;overflow-y:auto;padding:12px;background:#f8fafc;display:flex;justify-content:center;">
                        <div style="width:100%;max-width:380px;background:#fff;border:1px solid #cbd5e1;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);padding:10px;border-radius:6px;color:#000;">
                            ${receiptHtml}
                        </div>
                    </div>
                    <div style="padding:14px 18px;border-top:1px solid var(--border-color);display:flex;gap:8px;justify-content:space-between;background:var(--card-dark);flex-wrap:wrap;">
                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('posReceiptModal').style.display='none'" style="font-size:0.88rem;padding:8px 12px;">إغلاق</button>
                        <div style="display:flex;gap:6px;">
                            <button type="button" class="btn btn-secondary" onclick="printThermalReceiptPopup()" style="font-size:0.88rem;padding:8px 12px;" title="طباعة من خلال نافذة مستقلة"><i class="fa-solid fa-window-restore"></i> نافذة طباعة</button>
                            <button type="button" class="btn btn-primary-soft" onclick="printThermalReceipt()" style="font-size:0.92rem;padding:8px 16px;font-weight:700;"><i class="fa-solid fa-print"></i> طباعة حرارية مباشرة</button>
                        </div>
                    </div>
                </div>
            `;
            modal.style.display = 'flex';
        }

        if (typeof window !== 'undefined') {
            window.addEventListener('ar_cloud_data_updated', async () => {
                try {
                    _allProducts = (await ARDB.getAll('products')) || [];
                    _categories = (await ARDB.getAll('categories')) || [];
                    _customers = (await ARDB.getAll('customers')) || [];
                    renderCategories();
                    const sVal = document.getElementById('barcodeSearch') ? document.getElementById('barcodeSearch').value.trim().toLowerCase() : '';
                    renderProducts(sVal);
                } catch(e){}
            });
        }

        window.load = initPOS;
        window.loadPos = initPOS;
        initPOS();
    </script>
    <div id="thermalPrintArea"></div>
</body>
</html>
