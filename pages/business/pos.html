<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <script>
        try {
            var l = localStorage.getItem('ar_lang') || 'ar';
            document.documentElement.lang = l;
            document.documentElement.dir = (l === 'en') ? 'ltr' : 'rtl';
        } catch(e) {}
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقطة البيع (POS) الكاشير — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .pos-grid { display: grid; grid-template-columns: 1fr 380px; gap: 18px; height: calc(100vh - 110px); }
        .pos-products { display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
        .pos-cart { background: var(--card-dark); border: 1px solid var(--border-color); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; box-shadow: var(--shadow-card); }
        .prod-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 12px; overflow-y: auto; padding-inline-end: 4px; flex: 1; }
        .prod-item { background: var(--card-dark); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; cursor: pointer; transition: transform 0.2s, border-color 0.2s; text-align: center; }
        .prod-item:hover { transform: translateY(-2px); border-color: var(--accent-cyan); }
        .cart-items { flex: 1; overflow-y: auto; margin: 14px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 8px 0; }
        .cart-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); }
        @media (max-width: 900px) {
            .pos-grid { grid-template-columns: 1fr; height: auto; }
        }
    </style>
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>

    <main class="pagewrap" style="padding:16px 22px;max-width:1400px;margin:0 auto;">
        <div class="page-head" style="margin-bottom:12px;">
            <div>
                <h2><i class="fa-solid fa-cash-register" style="color:var(--success);"></i> نقطة البيع (POS)</h2>
                <div class="sub">نظام الكاشير والمبيعات السريعة</div>
            </div>
            <div style="display:flex;gap:10px;align-items:center;">
                <div class="sale-type-toggle" style="display:flex;background:var(--card-dark);border:1px solid var(--border-color);border-radius:8px;padding:3px;gap:2px;">
                    <button id="btnSaleRetail" class="btn btn-sm btn-primary-soft" onclick="setSaleType('retail')" style="border-radius:6px;font-size:0.8rem;padding:6px 12px;"><i class="fa-solid fa-user"></i> بيع قطاعي</button>
                    <button id="btnSaleWholesale" class="btn btn-sm btn-secondary" onclick="setSaleType('wholesale')" style="border-radius:6px;font-size:0.8rem;padding:6px 12px;"><i class="fa-solid fa-boxes-stacked"></i> بيع جملة</button>
                </div>
                <input id="barcodeSearch" placeholder="🔍 ابحث بالاسم أو الباركوود (أو امسح الباركوود مباشرة)..." style="padding:8px 14px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-dark);color:var(--text-primary);width:320px;" autofocus>
            </div>
        </div>

        <div class="pos-grid">
            <!-- قائمة المنتجات والتصنيفات -->
            <div class="pos-products">
                <div id="categoryTabs" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;">
                    <button class="btn btn-secondary active" onclick="filterCategory(null)" style="padding:6px 14px;font-size:0.85rem;">الكل</button>
                </div>
                <div class="prod-cards" id="productsGrid"></div>
            </div>

            <!-- سلة المبيعات والحساب -->
            <div class="pos-cart">
                <div style="display:flex;align-items:center;justify-content:space-between;font-weight:700;">
                    <span><i class="fa-solid fa-cart-shopping" style="color:var(--accent-cyan);"></i> الفاتورة الحالية</span>
                    <button class="btn btn-secondary" onclick="clearCart()" style="padding:4px 8px;font-size:0.75rem;color:var(--danger);"><i class="fa-solid fa-trash-can"></i> تفريغ</button>
                </div>

                <div style="margin:10px 0;">
                    <label style="font-size:0.8rem;color:var(--text-secondary);display:block;margin-bottom:4px;">العميل:</label>
                    <select id="posCustomer" onchange="onPosCustomerChange()" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-dark);color:var(--text-primary);"></select>
                    <button id="posLocBtn" type="button" class="btn btn-secondary" onclick="pickPOSLocation()" style="width:100%;margin-top:6px;font-size:0.8rem;padding:6px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;">
                        <i class="fa-solid fa-location-dot" style="color:var(--accent-cyan);"></i> <span id="posLocText">تحديد موقع الفاتورة / التسليم (GPS)</span>
                    </button>
                </div>

                <div class="cart-items" id="cartItems">
                    <div style="text-align:center;padding:40px 0;color:var(--text-secondary);font-size:0.9rem;">السلة فارغة، انقر على المنتجات لإضافتها</div>
                </div>

                <div style="display:flex;flex-direction:column;gap:8px;font-size:0.95rem;">
                    <div style="display:flex;justify-content:space-between;">
                        <span>المجموع:</span>
                        <b id="subTotal">0.00 ج.م</b>
                    </div>
                    <div style="display:flex;justify-content:space-between;color:var(--success);font-size:1.2rem;font-weight:700;margin-top:6px;border-top:1px solid var(--border-color);padding-top:8px;">
                        <span>الإجمالي المستحق:</span>
                        <span id="grandTotal">0.00 ج.م</span>
                    </div>
                    <button class="btn btn-primary-soft" onclick="checkout()" style="width:100%;padding:12px;font-size:1.05rem;margin-top:10px;"><i class="fa-solid fa-print"></i> إتمام الدفع وطباعة الفاتورة</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../../js/ui.js"></script>
    <script src="../../js/db.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        let _allProducts = [];
        let _categories = [];
        let _customers = [];
        let _cart = [];
        let _selectedCat = null;
        let _posLocation = null;
        let _saleType = 'retail';

        function getProdPrice(prod) {
            if (!prod) return 0;
            if (_saleType === 'wholesale') {
                return prod.wholesalePrice || prod.price || 0;
            }
            return prod.price || 0;
        }

        function setSaleType(type) {
            _saleType = type;
            const btnR = document.getElementById('btnSaleRetail');
            const btnW = document.getElementById('btnSaleWholesale');
            if (type === 'wholesale') {
                if (btnR) btnR.className = 'btn btn-sm btn-secondary';
                if (btnW) btnW.className = 'btn btn-sm btn-primary-soft';
            } else {
                if (btnR) btnR.className = 'btn btn-sm btn-primary-soft';
                if (btnW) btnW.className = 'btn btn-sm btn-secondary';
            }
            _cart.forEach(item => {
                const prod = _allProducts.find(p => String(p.id) === String(item.productId));
                if (prod) item.price = getProdPrice(prod);
            });
            renderCart();
            renderProducts(document.getElementById('barcodeSearch') ? document.getElementById('barcodeSearch').value.trim().toLowerCase() : '');
        }

        async function initPOS() {
            _allProducts = (await ARDB.getAll('products')) || [];
            _categories = (await ARDB.getAll('categories')) || [];
            _customers = (await ARDB.getAll('customers')) || [];
            
            const custSel = document.getElementById('posCustomer');
            if (custSel) {
                const curVal = custSel.value;
                custSel.innerHTML = '<option value="">— عميل عام —</option>' + _customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                if (curVal) custSel.value = curVal;
            }

            renderCategories();
            renderProducts();

            const bInput = document.getElementById('barcodeSearch');
            if (bInput && !bInput._hasListener) {
                bInput._hasListener = true;
                bInput.addEventListener('input', (e) => {
                    const q = e.target.value.trim().toLowerCase();
                    renderProducts(q);
                });
                bInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const q = e.target.value.trim().toLowerCase();
                        if (!q) return;
                        const match = _allProducts.find(p => p && ((p.barcode && String(p.barcode).toLowerCase() === q) || (p.name && String(p.name).toLowerCase() === q)));
                        if (match) {
                            addToCart(match.id);
                            e.target.value = '';
                            renderProducts('');
                            UI.toast('تمت إضافة المنتج للسلة: ' + match.name, 'ok');
                        } else {
                            UI.toast('لم يتم العثور على صنف بالباركود: ' + q, 'warn');
                        }
                    }
                });
            }
        }

        function onPosCustomerChange() {
            const cid = document.getElementById('posCustomer') ? document.getElementById('posCustomer').value : '';
            if (cid) {
                const cust = _customers.find(c => String(c.id) === String(cid));
                if (cust && (cust.lat || cust.address)) {
                    _posLocation = { lat: cust.lat, lng: cust.lng, address: cust.address };
                    updatePosLocText();
                }
            } else {
                _posLocation = null;
                updatePosLocText();
            }
        }

        function pickPOSLocation() {
            if (typeof ARLocation !== 'undefined') {
                ARLocation.openMapModal(_posLocation, (res) => {
                    if (res) {
                        _posLocation = res;
                        updatePosLocText();
                        UI.toast('تم تحديد موقع الفاتورة / الكاشير', 'ok');
                    }
                });
            } else {
                UI.toast('تعذر تحميل الخريطة', 'warn');
            }
        }

        function updatePosLocText() {
            const txt = document.getElementById('posLocText');
            if (!txt) return;
            if (_posLocation && (_posLocation.address || _posLocation.lat)) {
                const desc = _posLocation.address ? _posLocation.address.slice(0, 22) + '...' : `${_posLocation.lat}, ${_posLocation.lng}`;
                txt.innerHTML = `<span style="color:var(--success);"><i class="fa-solid fa-location-check"></i> ${desc}</span>`;
            } else {
                txt.textContent = 'تحديد موقع الفاتورة / التسليم (GPS)';
            }
        }

        function renderCategories() {
            const tabs = document.getElementById('categoryTabs');
            if (!tabs) return;
            let html = `<button class="btn btn-secondary ${!_selectedCat ? 'active' : ''}" onclick="filterCategory(null)" style="padding:6px 14px;font-size:0.85rem;">الكل</button>`;
            _categories.forEach(c => {
                const activeClass = String(_selectedCat) === String(c.id) ? 'active' : '';
                html += `<button class="btn btn-secondary ${activeClass}" onclick="filterCategory('${c.id}')" style="padding:6px 14px;font-size:0.85rem;">${c.name}</button>`;
            });
            tabs.innerHTML = html;
        }

        function filterCategory(catId) {
            _selectedCat = catId;
            renderCategories();
            renderProducts();
        }

        function renderProducts(query = '') {
            const grid = document.getElementById('productsGrid');
            if (!grid) return;
            let filtered = _allProducts;
            if (_selectedCat) {
                filtered = filtered.filter(p => p && p.categoryId != null && String(p.categoryId) === String(_selectedCat));
            }
            if (query) {
                filtered = filtered.filter(p => (p.name && p.name.toLowerCase().includes(query)) || (p.barcode && String(p.barcode).includes(query)));
            }

            if (!filtered.length) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-secondary);">لا توجد منتجات مطابقة</div>';
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="prod-item" onclick="addToCart('${p.id}')">
                    <div style="font-size:1.5rem;margin-bottom:6px;color:var(--accent-cyan);"><i class="fa-solid fa-box"></i></div>
                    <div style="font-weight:600;font-size:0.85rem;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.name}</div>
                    <div style="color:var(--success);font-weight:700;font-size:0.9rem;">${UI.money(getProdPrice(p))}</div>
                </div>
            `).join('');
        }

        async function addToCart(prodId) {
            const prod = _allProducts.find(p => String(p.id) === String(prodId));
            if (!prod) return;

            let existing = _cart.find(c => String(c.productId) === String(prodId));

            if (prod.hasSerials) {
                const allSerials = await ARDB.getAll('serials');
                const avail = (allSerials || []).filter(s => String(s.productId) === String(prodId) && s.status === 'available');
                
                const usedSerialIds = _cart.flatMap(c => c.serialIds || []);
                const unselectedAvail = avail.filter(s => !usedSerialIds.includes(s.id));

                if (!unselectedAvail.length) {
                    UI.toast('لا توجد سريالات إضافية متاحة في المخزن لهذا المنتج!', 'warn');
                    return;
                }
                
                let sOptions = unselectedAvail.map(s => s.serialNumber).join('\n');
                let pick = prompt('أدخل الرقم التسلسلي (S/N) للقطعة أو اختر من المتاح:\n' + sOptions, unselectedAvail[0].serialNumber);
                if (!pick) return;
                pick = pick.trim();

                const matched = unselectedAvail.find(s => s.serialNumber.toLowerCase() === pick.toLowerCase());
                if (!matched) {
                    UI.toast('الرقم التسلسلي غير موجود أو غير متاح!', 'error');
                    return;
                }

                if (existing) {
                    existing.quantity += 1;
                    existing.serialIds.push(matched.id);
                    existing.serials.push(matched.serialNumber);
                    existing.price = getProdPrice(prod);
                } else {
                    _cart.push({
                        productId: prod.id,
                        productName: prod.name,
                        price: getProdPrice(prod),
                        quantity: 1,
                        serialIds: [matched.id],
                        serials: [matched.serialNumber]
                    });
                }
            } else {
                if (existing) {
                    existing.quantity += 1;
                    existing.price = getProdPrice(prod);
                } else {
                    _cart.push({
                        productId: prod.id,
                        productName: prod.name,
                        price: getProdPrice(prod),
                        quantity: 1,
                        serialIds: [],
                        serials: []
                    });
                }
            }
            renderCart();
        }

        function updateQty(prodId, delta) {
            const item = _cart.find(c => String(c.productId) === String(prodId));
            if (!item) return;

            if (delta > 0) {
                const prod = _allProducts.find(p => String(p.id) === String(prodId));
                if (prod && prod.hasSerials) {
                    addToCart(prodId);
                    return;
                }
                item.quantity += 1;
            } else {
                item.quantity -= 1;
                if (item.serials && item.serials.length) {
                    item.serialIds.pop();
                    item.serials.pop();
                }
                if (item.quantity <= 0) {
                    _cart = _cart.filter(c => c !== item);
                }
            }
            renderCart();
        }

        function clearCart() {
            _cart = [];
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            if (!_cart.length) {
                container.innerHTML = '<div style="text-align:center;padding:40px 0;color:var(--text-secondary);font-size:0.9rem;">السلة فارغة، انقر على المنتجات لإضافتها</div>';
                document.getElementById('subTotal').innerHTML = '0.00 ج.م';
                document.getElementById('grandTotal').innerHTML = '0.00 ج.م';
                return;
            }

            let total = 0;
            container.innerHTML = _cart.map((item) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                const serialsTag = (item.serials && item.serials.length)
                    ? `<div style="font-size:0.75rem;color:var(--accent-purple);margin-top:2px;"><i class="fa-solid fa-barcode"></i> S/N: ${item.serials.join(', ')}</div>`
                    : '';
                return `
                    <div class="cart-row" style="padding:10px 0;border-bottom:1px solid var(--border-color);">
                        <div style="flex:1;">
                            <div style="font-weight:600;font-size:0.88rem;color:var(--text-primary);">${item.productName}</div>
                            ${serialsTag}
                            <div style="font-size:0.75rem;color:var(--text-secondary);margin-top:2px;">${UI.money(item.price)} × ${item.quantity}</div>
                        </div>
                        <div style="display:flex;align-items:center;gap:6px;">
                            <button onclick="updateQty('${item.productId}', -1)" class="icon-btn" style="width:24px;height:24px;">-</button>
                            <span style="font-size:0.85rem;font-weight:700;min-width:18px;text-align:center;">${item.quantity}</span>
                            <button onclick="updateQty('${item.productId}', 1)" class="icon-btn" style="width:24px;height:24px;">+</button>
                            <b style="min-width:65px;text-align:left;font-size:0.85rem;color:var(--success);">${UI.money(itemTotal)}</b>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('subTotal').innerHTML = UI.money(total) + ' ج.م';
            document.getElementById('grandTotal').innerHTML = UI.money(total) + ' ج.م';
        }

        async function checkout() {
            if (!_cart.length) return UI.toast('السلة فارغة!', 'warn');
            const total = _cart.reduce((s, c) => s + (c.price * c.quantity), 0);

            if (typeof ARPayments !== 'undefined') {
                ARPayments.openCheckoutModal(total, async (payRes) => {
                    if (payRes && payRes.status === 'success') {
                        await finalizeInvoice(total, payRes);
                    }
                });
            } else {
                await finalizeInvoice(total, {
                    method: 'cash',
                    payments: [{ method: 'cash', amount: total, label: 'نقداً (كاش)' }]
                });
            }
        }

        async function finalizeInvoice(total, payRes) {
            const invNumber = await ARDB.nextSeq('invoice_seq', 'POS-', 5);
            const customerIdVal = document.getElementById('posCustomer') ? document.getElementById('posCustomer').value : '';
            const customerId = customerIdVal ? customerIdVal : null;
            
            const payments = (payRes && payRes.payments && payRes.payments.length)
                ? payRes.payments
                : [{ method: (typeof payRes === 'string' ? payRes : (payRes && payRes.method ? payRes.method : 'cash')), amount: total, label: 'كاش' }];

            const payMethodSummary = payments.map(p => {
                const mObj = typeof ARPayments !== 'undefined' ? ARPayments.METHODS.find(m => m.id === p.method) : null;
                const lbl = mObj ? mObj.label : (p.label || p.method);
                return `${lbl}: ${p.amount} ج.م`;
            }).join(' + ');

            const isCredit = payments.some(p => p.method === 'bnpl' || p.method === 'credit');

            const invItems = _cart.map(c => {
                const prod = _allProducts.find(p => String(p.id) === String(c.productId));
                return {
                    productId: c.productId,
                    name: c.productName,
                    quantity: c.quantity,
                    price: c.price,
                    cost: prod ? (prod.cost || 0) : 0,
                    total: c.price * c.quantity,
                    serialIds: c.serialIds || [],
                    serials: c.serials || []
                };
            });

            const invoice = {
                number: invNumber,
                date: Date.now(),
                customerId: customerId,
                total: total,
                items: invItems,
                payments: payments,
                paymentMethod: payMethodSummary,
                paymentType: isCredit ? 'credit' : 'cash',
                saleType: _saleType,
                location: _posLocation,
                type: 'pos'
            };
            const invId = await ARDB.add('invoices', invoice);
            
            for (const item of invItems) {
                if (item.serialIds && item.serialIds.length) {
                    for (const sid of item.serialIds) {
                        await ARDB.update('serials', sid, { status: 'sold', invoiceId: invId, invoiceDate: Date.now() });
                    }
                }
            }

            for (const item of invItems) {
                await ARDB.add('stockMovements', {
                    date: Date.now(),
                    productId: item.productId,
                    direction: 'out',
                    type: 'pos',
                    quantity: item.quantity || 1,
                    note: 'بيع كاشير POS ' + invNumber
                });
            }

            if (total > 0) {
                const journalLines = [];
                payments.forEach(p => {
                    if (p.amount > 0) {
                        const accId = (p.method === 'bnpl' || p.method === 'credit') ? 4 : 3;
                        journalLines.push({ accountId: accId, debit: p.amount, credit: 0 });
                    }
                });
                journalLines.push({ accountId: 11, debit: 0, credit: total });

                await ARDB.add('journalEntries', {
                    number: await ARDB.nextSeq('journalAuto', 'JRN-', 6),
                    date: Date.now(),
                    desc: 'مبيعات كاشير POS ' + invNumber + ' (' + payMethodSummary + ')',
                    lines: journalLines
                });

                if (customerId) {
                    const cashPaidAmt = payments.filter(p => p.method !== 'bnpl' && p.method !== 'credit').reduce((s, p) => s + (p.amount || 0), 0);
                    if (cashPaidAmt > 0) {
                        await ARDB.add('payments', {
                            date: Date.now(),
                            type: 'receipt',
                            partyType: 'customer',
                            partyId: customerId,
                            amount: cashPaidAmt,
                            method: 'cash',
                            note: 'تحصيل كاشير فاتورة ' + invNumber
                        });
                    }
                }
            }

            if (typeof ARAudit !== 'undefined') {
                ARAudit.logAction('إصدار فاتورة POS', 'المبيعات', `فاتورة رقم ${invNumber} بقيمة ${total} عبر ${payMethodSummary}`);
            }

            UI.toast('تم حفظ وإتمام الفاتورة رقم: ' + invNumber, 'ok');

            const win = window.open('', '', 'width=400,height=600');
            if (win) {
                const payDetailsRows = payments.map(p => {
                    const mObj = typeof ARPayments !== 'undefined' ? ARPayments.METHODS.find(m => m.id === p.method) : null;
                    const lbl = mObj ? mObj.label : (p.label || p.method);
                    return `<tr><td><b>${lbl}:</b></td><td style="text-align:left;">${UI.money(p.amount)} ج.م</td></tr>`;
                }).join('');

                win.document.write(`
                    <html lang="ar" dir="rtl">
                    <head><title>إيصال ${invNumber}</title></head>
                    <body style="font-family:sans-serif;padding:15px;text-align:center;font-size:12px;">
                        <h3>إيصال مبيعات — AR-Program</h3>
                        <p>رقم الفاتورة: ${invNumber}</p>
                        <p>التاريخ: ${new Date().toLocaleString('ar-EG')}</p>
                        <hr>
                        <table style="width:100%;text-align:right;font-size:11px;">
                            ${invItems.map(c => `<tr><td>${c.name} ${(c.serials && c.serials.length) ? '(S/N: ' + c.serials.join(',') + ')' : ''} (x${c.quantity})</td><td style="text-align:left;">${UI.money(c.total)}</td></tr>`).join('')}
                        </table>
                        <hr>
                        <div style="font-weight:700;margin-bottom:6px;">تفاصيل السداد:</div>
                        <table style="width:100%;text-align:right;font-size:11px;margin-bottom:8px;">
                            ${payDetailsRows}
                        </table>
                        <hr>
                        <h3 style="margin-top:10px;">الإجمالي: ${UI.money(total)} ج.م</h3>
                        <p>شكراً لزيارتكم!</p>
                        <script>window.onload = function() { window.print(); window.close(); }<\/script>
                    </body>
                    </html>
                `);
                win.document.close();
            }

            clearCart();
        }

        if (typeof window !== 'undefined') {
            window.addEventListener('ar_cloud_data_updated', async () => {
                try {
                    _allProducts = (await ARDB.getAll('products')) || [];
                    _categories = (await ARDB.getAll('categories')) || [];
                    _customers = (await ARDB.getAll('customers')) || [];
                    renderCategories();
                    const sVal = document.getElementById('barcodeSearch') ? document.getElementById('barcodeSearch').value.trim().toLowerCase() : '';
                    renderProducts(sVal);
                } catch(e){}
            });
        }

        window.load = initPOS;
        window.loadPos = initPOS;
        initPOS();
    </script>
</body>
</html>
