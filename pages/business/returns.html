<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرتجعات المبيعات — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>
    <main class="pagewrap" style="padding:22px;max-width:1200px;margin:0 auto;">
        <div class="page-head">
            <div>
                <h2>مرتجعات المبيعات</h2>
                <div class="sub">إرجاع أصناف من فواتير بيع وإعادتها للمخزون</div>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary-soft" onclick="openRetModal()"><i class="fa-solid fa-plus"></i> مرتجع جديد</button>
            </div>
        </div>
        <div class="table-card">
            <div class="table-head">سجل المرتجعات</div>
            <div class="table-scroll">
                <table class="data-table">
                    <thead><tr><th>الرقم</th><th>التاريخ</th><th>الفاتورة</th><th>عدد الأصناف</th><th>الإجمالي</th><th></th></tr></thead>
                    <tbody id="retBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="retModal" class="modal-mask" style="visibility:hidden;opacity:0;">
        <div class="modal-box" style="width:min(820px,94vw);">
            <h3>مرتجع مبيعات</h3>
            <div class="form-grid">
                <div class="form-item"><label>التاريخ</label><input type="date" id="retDate"></div>
                <div class="form-item" style="position:relative;">
                    <label><i class="fa-solid fa-barcode" style="color:var(--accent-cyan);"></i> بحث بالباركود أو الفاتورة</label>
                    <div style="display:flex;gap:6px;">
                        <div style="position:relative;flex:1;">
                            <i class="fa-solid fa-search" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.85rem;"></i>
                            <input type="text" id="retInvSearch" oninput="searchReturnInvoice()" onkeydown="onRetSearchKey(event)" placeholder="مسح الباركود أسفل الفاتورة أو كتابة رقمها..." autocomplete="off" style="width:100%;padding:8px 30px 8px 10px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);">
                        </div>
                        <button type="button" class="btn btn-secondary" onclick="resetRetInvSearch()" title="إعادة ضبط"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div id="retInvResults" style="display:none;position:absolute;top:100%;right:0;left:0;max-height:220px;overflow-y:auto;background:var(--card-dark);border:1px solid var(--border-color);border-radius:8px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,0.6);margin-top:4px;padding:4px;"></div>
                    <div id="retInvBadge" style="margin-top:4px;font-size:0.85rem;display:none;"></div>
                </div>
                <div class="form-item" style="grid-column:1/-1;"><label>ملاحظة</label><input id="retNote"></div>
            </div>
            <div class="table-scroll" style="margin-bottom:12px;">
                <table class="data-table">
                    <thead><tr><th>المنتج</th><th>الكمية المباعة</th><th>الكمية المرتجعة</th><th>سعر المرتجع</th><th>الإجمالي</th></tr></thead>
                    <tbody id="retLinesBody"></tbody>
                </table>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                <span>الإجمالي: <b id="retTotal">0.00</b></span>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn btn-secondary" onclick="closeRetModal()">إلغاء</button>
                <button class="btn btn-primary-soft" onclick="saveReturn()">حفظ المرتجع</button>
            </div>
        </div>
    </div>

    <script src="../../js/ui.js"></script>
    <script src="../../js/db.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        let pickedInvoice = null;
        let _allInvoices = [];
        let _custById = {};
        const salesAcc = 11, cashAcc = 3;

        async function load() {
            const [ret, invoices, customers] = await Promise.all([ARDB.getAll('invoiceReturns'), ARDB.getAll('invoices'), ARDB.getAll('customers')]);
            _allInvoices = invoices || [];
            _custById = {}; customers.forEach(c => _custById[c.id] = c);

            const sorted = ret.sort((a, b) => (b.date || 0) - (a.date || 0));
            document.getElementById('retBody').innerHTML = sorted.map(r =>
                '<tr><td class="num" style="font-weight:700;">' + r.number + '</td>' +
                '<td>' + UI.date(r.date) + '</td>' +
                '<td>' + (r.invoiceNumber || '—') + '</td>' +
                '<td class="num">' + (r.items ? r.items.length : 0) + '</td>' +
                '<td class="num" style="font-weight:700;color:var(--danger);">' + UI.money(r.total) + '</td>' +
                '<td style="text-align:left;"><button class="btn btn-sm btn-danger" onclick="delReturn(' + r.id + ')"><i class="fa-solid fa-trash"></i></button></td></tr>'
            ).join('') || '<tr><td colspan="6" class="empty-state">لا توجد مرتجعات</td></tr>';
        }

        async function openRetModal() {
            document.getElementById('retModal').style.visibility = 'visible';
            document.getElementById('retModal').style.opacity = '1';
            document.getElementById('retDate').value = UI.todayInput();
            document.getElementById('retNote').value = '';
            document.getElementById('retLinesBody').innerHTML = '<tr><td colspan="5" class="empty-state">قم بمسح الباركود أو اختيار فاتورة بالأسفل</td></tr>';
            document.getElementById('retTotal').textContent = '0.00';
            resetRetInvSearch();
            await load();
            setTimeout(() => {
                const inp = document.getElementById('retInvSearch');
                if (inp) inp.focus();
            }, 150);
            window.addEventListener('ar_cloud_data_updated', load);
        }

        function closeRetModal() {
            document.getElementById('retModal').style.visibility = 'hidden';
            document.getElementById('retModal').style.opacity = '0';
        }

        function searchReturnInvoice() {
            const rawVal = document.getElementById('retInvSearch').value || '';
            const query = rawVal.trim().replace(/^\*+|\*+$/g, '').toLowerCase();
            const resDiv = document.getElementById('retInvResults');

            if (!query) {
                resDiv.style.display = 'none';
                resDiv.innerHTML = '';
                return;
            }

            const matches = _allInvoices.filter(inv => {
                const num = String(inv.number || '').toLowerCase();
                const id = String(inv.id || '').toLowerCase();
                const custName = (inv.customerId && _custById[inv.customerId] ? _custById[inv.customerId].name : '').toLowerCase();
                const cleanNum = num.replace(/[^a-z0-9]/g, '');
                const cleanQuery = query.replace(/[^a-z0-9]/g, '');

                return num === query || id === query || (cleanQuery && cleanNum === cleanQuery) || num.includes(query) || custName.includes(query);
            });

            const exactMatch = _allInvoices.find(inv => {
                const num = String(inv.number || '').toLowerCase();
                const id = String(inv.id || '').toLowerCase();
                const cleanNum = num.replace(/[^a-z0-9]/g, '');
                const cleanQuery = query.replace(/[^a-z0-9]/g, '');
                return num === query || id === query || (cleanQuery && cleanNum === cleanQuery);
            });

            if (exactMatch && query.length >= 4) {
                selectReturnInvoice(exactMatch.id);
                resDiv.style.display = 'none';
                return;
            }

            if (!matches.length) {
                resDiv.innerHTML = '<div style="padding:10px;color:var(--text-muted);text-align:center;">لا توجد فاتورة مطابقة للباركود المدخل</div>';
                resDiv.style.display = 'block';
                return;
            }

            resDiv.innerHTML = matches.slice(0, 10).map(inv => {
                const custName = inv.customerId && _custById[inv.customerId] ? _custById[inv.customerId].name : 'بدون عميل';
                return `<div onclick="selectReturnInvoice(${inv.id})" style="padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background 0.15s;" onmouseover="this.style.background='var(--accent-primary-soft)'" onmouseout="this.style.background='transparent'">
                    <div>
                        <b style="color:var(--accent-cyan);"><i class="fa-solid fa-barcode"></i> ${inv.number || ('INV-' + inv.id)}</b>
                        <span style="font-size:0.85rem;color:var(--text-secondary);margin-inline-start:8px;">${custName}</span>
                    </div>
                    <div style="font-weight:700;color:var(--success);font-size:0.9rem;">${UI.money(inv.total)}</div>
                </div>`;
            }).join('');

            resDiv.style.display = 'block';
        }

        function selectReturnInvoice(id) {
            const inv = _allInvoices.find(i => i.id === id);
            if (!inv) return;
            pickedInvoice = inv;
            const custName = inv.customerId && _custById[inv.customerId] ? _custById[inv.customerId].name : 'بدون عميل';
            
            document.getElementById('retInvSearch').value = inv.number || ('INV-' + inv.id);
            document.getElementById('retInvResults').style.display = 'none';
            
            const items = inv.items || [];
            const grossSubtotal = inv.subtotal || items.reduce((s, it) => s + ((Number(it.price) || 0) * (Number(it.quantity || it.qty) || 1)), 0);
            let invDiscount = Number(inv.discount || inv.discountAmount || 0);
            if (!invDiscount && inv.discountType === 'percent' && inv.discountValue) {
                invDiscount = (grossSubtotal * Number(inv.discountValue)) / 100;
            }
            if (!invDiscount && inv.total && grossSubtotal > inv.total) {
                invDiscount = grossSubtotal - inv.total;
            }

            const badge = document.getElementById('retInvBadge');
            badge.style.display = 'block';
            let badgeHtml = `<span class="badge badge-green"><i class="fa-solid fa-check"></i> تم تحديد الفاتورة: ${inv.number} (${custName}) — الإجمالي: ${UI.money(inv.total)}</span>`;
            if (invDiscount > 0) {
                const discPct = grossSubtotal > 0 ? (invDiscount / grossSubtotal * 100).toFixed(1).replace(/\.0$/, '') : 0;
                badgeHtml += ` <span class="badge badge-amber" style="background:rgba(245,158,11,0.15);color:var(--warning);border:1px solid rgba(245,158,11,0.3);margin-inline-start:6px;"><i class="fa-solid fa-tags"></i> خصم الفاتورة: ${UI.money(invDiscount)} (${discPct}% — مقسّم تلقائياً على الأصناف)</span>`;
            }
            badge.innerHTML = badgeHtml;

            loadInvLines(inv.id);
        }

        function resetRetInvSearch() {
            pickedInvoice = null;
            document.getElementById('retInvSearch').value = '';
            document.getElementById('retInvResults').style.display = 'none';
            document.getElementById('retInvResults').innerHTML = '';
            const badge = document.getElementById('retInvBadge');
            badge.style.display = 'none';
            badge.innerHTML = '';
            document.getElementById('retLinesBody').innerHTML = '<tr><td colspan="5" class="empty-state">اختر أو امسح باركود الفاتورة أولاً</td></tr>';
            document.getElementById('retTotal').textContent = '0.00';
        }

        function onRetSearchKey(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const rawVal = document.getElementById('retInvSearch').value || '';
                const query = rawVal.trim().replace(/^\*+|\*+$/g, '').toLowerCase();
                if (!query) return;

                const match = _allInvoices.find(inv => {
                    const num = String(inv.number || '').toLowerCase();
                    const id = String(inv.id || '').toLowerCase();
                    const cleanNum = num.replace(/[^a-z0-9]/g, '');
                    const cleanQuery = query.replace(/[^a-z0-9]/g, '');
                    return num === query || id === query || (cleanQuery && cleanNum === cleanQuery) || num.includes(query);
                });

                if (match) {
                    selectReturnInvoice(match.id);
                } else {
                    UI.toast('لم يتم العثور على فاتورة بهذا الباركود', 'warn');
                }
            }
        }
        async function loadInvLines(id) {
            if (!id) { document.getElementById('retLinesBody').innerHTML = '<tr><td colspan="5" class="empty-state">اختر فاتورة أولًا</td></tr>'; recalcRet(); return; }
            pickedInvoice = await ARDB.getById('invoices', id);
            if (!pickedInvoice) return;
            const products = await ARDB.getAll('products');
            const pById = {}; products.forEach(p => pById[p.id] = p);

            const items = pickedInvoice.items || [];
            const grossSubtotal = pickedInvoice.subtotal || items.reduce((s, it) => s + ((Number(it.price) || 0) * (Number(it.quantity || it.qty) || 1)), 0);
            let invDiscount = Number(pickedInvoice.discount || pickedInvoice.discountAmount || 0);
            if (!invDiscount && pickedInvoice.discountType === 'percent' && pickedInvoice.discountValue) {
                invDiscount = (grossSubtotal * Number(pickedInvoice.discountValue)) / 100;
            }
            if (!invDiscount && pickedInvoice.total && grossSubtotal > pickedInvoice.total) {
                invDiscount = grossSubtotal - pickedInvoice.total;
            }
            const discRatio = (grossSubtotal > 0 && invDiscount > 0) ? (invDiscount / grossSubtotal) : 0;

            document.getElementById('retLinesBody').innerHTML = items.map((it, i) => {
                const pid = it.productId || it.id;
                const pName = it.name || (pById[pid] ? pById[pid].name : 'صنف ' + pid);
                const qty = it.quantity || it.qty || 1;
                const origPrice = Number(it.price) || 0;
                const serialsText = (it.serials && it.serials.length) ? ' (S/N: ' + it.serials.join(', ') + ')' : '';
                
                const unitDisc = origPrice * discRatio;
                const netReturnPrice = Math.max(0, origPrice - unitDisc);
                const roundedNetPrice = Number(netReturnPrice.toFixed(2));

                const discHint = discRatio > 0
                    ? '<div style="font-size:0.75rem;color:var(--warning);margin-top:2px;"><i class="fa-solid fa-tag"></i> قبل الخصم: ' + UI.money(origPrice) + ' (خصم: -' + UI.money(unitDisc) + ')</div>'
                    : '<div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;">(السعر الأصلي: ' + UI.money(origPrice) + ')</div>';

                return '<tr>' +
                '<td>' + pName + serialsText + '</td>' +
                '<td class="num">' + qty + '</td>' +
                '<td><input type="number" min="0" max="' + qty + '" value="' + qty + '" class="ret-qty" style="width:70px;padding:8px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);" oninput="recalcRet()"></td>' +
                '<td><input type="number" step="0.01" min="0" value="' + roundedNetPrice + '" class="ret-price" data-orig="' + origPrice + '" style="width:90px;padding:8px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);" oninput="recalcRet()">' + discHint + '</td>' +
                '<td class="num ret-sub" style="font-weight:700;">' + UI.money(qty * roundedNetPrice) + '</td>' +
                '</tr>';
            }).join('');
            recalcRet();
        }
        function recalcRet() {
            let total = 0;
            document.querySelectorAll('#retLinesBody tr').forEach(tr => {
                const q = tr.querySelector('.ret-qty');
                const p = tr.querySelector('.ret-price');
                const sub = tr.querySelector('.ret-sub');
                if (q && sub) {
                    const priceVal = p ? (Number(p.value) || 0) : 0;
                    const v = (Number(q.value) || 0) * priceVal;
                    total += v;
                    sub.innerHTML = UI.money(v);
                }
            });
            document.getElementById('retTotal').innerHTML = UI.money(total);
        }

        async function saveReturn() {
            if (!pickedInvoice) { UI.toast('اختر فاتورة البيع', 'warn'); return; }
            const date = new Date(document.getElementById('retDate').value + 'T12:00:00').getTime();
            const note = document.getElementById('retNote').value.trim();
            const items = [];
            let total = 0;
            let anyQty = false;
            const rows = document.querySelectorAll('#retLinesBody tr');
            pickedInvoice.items.forEach((it, i) => {
                const tr = rows[i];
                const qEl = tr ? tr.querySelector('.ret-qty') : null;
                const pEl = tr ? tr.querySelector('.ret-price') : null;
                const q = qEl ? (Number(qEl.value) || 0) : 0;
                const returnPrice = pEl ? (Number(pEl.value) || 0) : it.price;
                const pid = it.productId || it.id;
                const origQty = it.quantity || it.qty || 1;
                if (q < 0 || q > origQty) { UI.toast('كمية مرتجعة أكبر من المباعة', 'error'); anyQty = false; total = -1; return; }
                if (q > 0) { items.push({ productId: pid, quantity: q, price: returnPrice, originalPrice: it.price, discountApportioned: Number((it.price - returnPrice).toFixed(2)), total: q * returnPrice }); total += q * returnPrice; anyQty = true; }
            });
            if (total < 0) return;
            if (!anyQty) { UI.toast('حدد كمية مرتجعة واحدة على الأقل', 'warn'); return; }

            const number = await ARDB.nextSeq('invoiceReturn', 'RET-', 6);
            await ARDB.add('invoiceReturns', { number, date, invoiceId: pickedInvoice.id, invoiceNumber: pickedInvoice.number, customerId: pickedInvoice.customerId, items, total, note, createdAt: Date.now() });

            // إعادة حالة السريالات للمخزون (متاح)
            const allSerials = await ARDB.getAll('serials');
            for (const it of items) {
                if (it.serials && it.serials.length) {
                    for (const sn of it.serials) {
                        const rec = (allSerials || []).find(s => String(s.productId) === String(it.productId) && s.serialNumber && s.serialNumber.toLowerCase() === sn.toLowerCase());
                        if (rec) {
                            await ARDB.update('serials', rec.id, { status: 'available', invoiceId: null });
                        }
                    }
                } else {
                    const recs = (allSerials || []).filter(s => String(s.productId) === String(it.productId) && String(s.invoiceId) === String(pickedInvoice.id) && s.status === 'sold');
                    for (let k = 0; k < Math.min(it.quantity, recs.length); k++) {
                        await ARDB.update('serials', recs[k].id, { status: 'available', invoiceId: null });
                    }
                }
            }

            // إعادة الأصناف للمخزون
            for (const it of items) {
                await ARDB.add('stockMovements', { date, productId: it.productId, direction: 'in', type: 'return_sale', quantity: it.quantity, note: 'مرتجع ' + number });
            }
            // قيد: إلغاء إيراد البيع
            if (total > 0) {
                await ARDB.add('journalEntries', {
                    number: await ARDB.nextSeq('journalAuto', 'JRN-', 6),
                    date, desc: 'مرتجع مبيعات ' + number,
                    lines: [
                        { accountId: salesAcc, debit: total, credit: 0 },
                        { accountId: cashAcc, debit: 0, credit: total }
                    ]
                });
            }
            UI.toast('تم حفظ المرتجع ' + number, 'ok');
            closeRetModal(); load();
        }
        async function delReturn(id) {
            const ok = await UI.confirmBox('حذف المرتجع؟ (لن تُعدل حركات المخزون)');
            if (!ok) return;
            await ARDB.remove('invoiceReturns', id);
            UI.toast('تم الحذف', 'ok'); load();
        }
        load();
    </script>
</body>
</html>
