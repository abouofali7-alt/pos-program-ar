<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فواتير البيع — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @media print {
            html, body, body * {
                background: #ffffff !important;
                color: #000000 !important;
                font-weight: 800 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                -webkit-font-smoothing: none !important;
                font-smooth: never !important;
            }
            body > *:not(#thermalPrintArea) {
                display: none !important;
            }
            #thermalPrintArea {
                display: block !important;
                position: relative !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 2mm 2mm 28mm 2mm !important;
                box-sizing: border-box !important;
                background: #ffffff !important;
                color: #000000 !important;
                font-family: 'Courier New', Monaco, 'Lucida Console', monospace !important;
                font-weight: 800 !important;
                direction: rtl !important;
                text-align: right !important;
                page-break-after: always !important;
                break-after: page !important;
            }
            #thermalPrintArea * {
                color: #000000 !important;
                background: transparent !important;
                font-weight: 800 !important;
            }
            @page {
                size: 80mm auto;
                margin: 0mm;
            }
        }
        #thermalPrintArea {
            display: none;
        }
    </style>
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>
    <main class="pagewrap" style="padding:22px;max-width:1200px;margin:0 auto;">
        <div class="page-head">
            <div>
                <h2>فواتير البيع</h2>
                <div class="sub">تسجيل المبيعات مع خصم تلقائي للمخزون</div>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary-soft" onclick="openInvModal()"><i class="fa-solid fa-plus"></i> فاتورة بيع</button>
            </div>
        </div>
        <div class="table-card">
            <div class="table-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 16px;">
                <span style="font-size:1.05rem;font-weight:700;">فواتير البيع</span>
                <div style="display:flex;align-items:center;gap:8px;width:min(420px,100%);">
                    <div style="position:relative;width:100%;">
                        <i class="fa-solid fa-barcode" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--accent-cyan);font-size:1rem;"></i>
                        <input type="text" id="invSearchInput" oninput="filterInvoices()" onkeydown="onInvSearchKey(event)" placeholder="مسح الباركود أو كتابة رقم الفاتورة / العميل..." style="width:100%;padding:8px 34px 8px 12px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);font-size:0.9rem;">
                    </div>
                    <button class="btn btn-sm btn-secondary" onclick="clearInvSearch()" title="إعادة ضبط البحث"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div class="table-scroll">
                <table class="data-table">
                    <thead><tr><th>الرقم / الباركود</th><th>التاريخ</th><th>العميل</th><th>عدد الأصناف</th><th>الموقع</th><th>طريقة الدفع</th><th>الإجمالي</th><th></th></tr></thead>
                    <tbody id="invBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="invModal" class="modal-mask" style="visibility:hidden;opacity:0;">
        <div class="modal-box" style="width:min(820px,94vw);">
            <h3>فاتورة بيع جديدة</h3>
            <div class="form-grid">
                <div class="form-item"><label>التاريخ</label><input type="date" id="invDate"></div>
                <div class="form-item"><label>العميل</label><select id="invCustomer" onchange="onInvCustChange()"></select></div>
                <div class="form-item"><label>طريقة الدفع</label>
                    <select id="invPayType">
                        <option value="cash">نقداً (كاش)</option>
                        <option value="credit">آجل (على الحساب)</option>
                    </select>
                </div>
                <div class="form-item"><label>ملاحظة</label><input id="invNote"></div>
                <div class="form-item" style="grid-column: 1 / -1;">
                    <label><i class="fa-solid fa-location-dot"></i> موقع التسليم / الجغرافيا</label>
                    <div style="display:flex;gap:8px;">
                        <input type="text" id="invLocation" placeholder="تحديد موقع التسليم على الخريطة..." readonly style="flex:1;">
                        <button type="button" class="btn btn-secondary" onclick="pickInvLocation()"><i class="fa-solid fa-map-pin"></i> الخريطة</button>
                    </div>
                </div>
            </div>
            <div style="margin-bottom:10px;"><button class="btn btn-sm" onclick="addInvLine()"><i class="fa-solid fa-plus"></i> إضافة صنف</button></div>
            <div class="table-scroll" style="margin-bottom:12px;">
                <table class="data-table">
                    <thead><tr><th>المنتج</th><th>الكمية</th><th>سعر البيع</th><th>الإجمالي</th><th></th></tr></thead>
                    <tbody id="invLinesBody"></tbody>
                </table>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                <span>الإجمالي: <b id="invTotal">0.00</b></span>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn btn-secondary" onclick="closeInvModal()">إلغاء</button>
                <button class="btn btn-primary-soft" onclick="saveInvoice()">حفظ الفاتورة</button>
            </div>
        </div>
    </div>

    <script src="../../js/ui.js"></script>
    <script src="../../js/db.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        let invLineCount = 0;
        let _invLocation = null;
        let _allCustomers = [];
        let _allInvoices = [];
        let _custById = {};

        async function load() {
            const [customers, invoices, products] = await Promise.all([ARDB.getAll('customers'), ARDB.getAll('invoices'), ARDB.getAll('products')]);
            _allCustomers = customers || [];
            _custById = {}; customers.forEach(c => _custById[c.id] = c);
            const sel = document.getElementById('invCustomer');
            sel.innerHTML = '<option value="">— بدون عميل —</option>' + customers.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('');

            _allInvoices = invoices.sort((a, b) => (b.date || 0) - (a.date || 0));
            filterInvoices();
        }

        function renderInvoices(list) {
            const html = list.map(inv => {
                const isCredit = inv.paymentType === 'credit';
                const locBadge = inv.location && (inv.location.lat || inv.location.address)
                    ? '<a href="https://maps.google.com/?q=' + (inv.location.lat || '') + ',' + (inv.location.lng || '') + '" target="_blank" class="badge badge-purple" style="text-decoration:none;"><i class="fa-solid fa-location-dot"></i> ' + (inv.location.address ? inv.location.address.slice(0, 14) + '...' : 'الخريطة') + '</a>'
                    : '<span style="color:var(--text-muted);">—</span>';
                const itemQty = inv.items ? inv.items.length : 0;
                const custName = inv.customerId && _custById[inv.customerId] ? _custById[inv.customerId].name : '—';
                return '<tr>' +
                '<td class="num" style="font-weight:700;"><i class="fa-solid fa-barcode" style="font-size:0.8rem;color:var(--accent-cyan);margin-inline-end:4px;"></i>' + (inv.number || ('INV-' + inv.id)) + '</td>' +
                '<td>' + UI.date(inv.date) + '</td>' +
                '<td>' + custName + '</td>' +
                '<td class="num">' + itemQty + '</td>' +
                '<td>' + locBadge + '</td>' +
                '<td><span class="badge ' + (isCredit ? 'badge-amber' : 'badge-green') + '">' + (isCredit ? 'آجل' : 'نقداً') + '</span></td>' +
                '<td class="num" style="font-weight:700;color:var(--success);">' + UI.money(inv.total) + '</td>' +
                '<td style="text-align:left;white-space:nowrap;">' +
                '<button class="btn btn-sm btn-secondary" onclick="printThermalInvoice(' + inv.id + ')" title="طباعة إيصال حراري (80mm)"><i class="fa-solid fa-receipt"></i> حراري</button> ' +
                '<button class="btn btn-sm" onclick="printInvoice(' + inv.id + ')" title="طباعة فاتورة A4"><i class="fa-solid fa-print"></i> A4</button> ' +
                '<button class="btn btn-sm btn-danger" onclick="delInvoice(' + inv.id + ')"><i class="fa-solid fa-trash"></i></button></td></tr>';
            }).join('') || '<tr><td colspan="8" class="empty-state">لا توجد فواتير مطابقة للبحث</td></tr>';

            document.getElementById('invBody').innerHTML = html;
        }

        function filterInvoices() {
            const rawVal = (document.getElementById('invSearchInput') ? document.getElementById('invSearchInput').value : '') || '';
            const query = rawVal.trim().replace(/^\*+|\*+$/g, '').toLowerCase();
            if (!query) {
                renderInvoices(_allInvoices);
                return;
            }

            const filtered = _allInvoices.filter(inv => {
                const num = String(inv.number || '').toLowerCase();
                const id = String(inv.id || '').toLowerCase();
                const custName = (inv.customerId && _custById[inv.customerId] ? _custById[inv.customerId].name : '').toLowerCase();
                const cashier = String(inv.cashierName || '').toLowerCase();
                const cleanNum = num.replace(/[^a-z0-9]/g, '');
                const cleanQuery = query.replace(/[^a-z0-9]/g, '');

                return num.includes(query) ||
                       id === query ||
                       (cleanQuery && cleanNum.includes(cleanQuery)) ||
                       custName.includes(query) ||
                       cashier.includes(query);
            });

            renderInvoices(filtered);
        }

        function clearInvSearch() {
            const inp = document.getElementById('invSearchInput');
            if (inp) { inp.value = ''; inp.focus(); }
            renderInvoices(_allInvoices);
        }

        function onInvSearchKey(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                filterInvoices();
            }
        }

        if (typeof window !== 'undefined') {
            window.addEventListener('ar_cloud_data_updated', () => {
                try { load(); } catch(e){}
            });
        }

        function onInvCustChange() {
            const cid = Number(document.getElementById('invCustomer').value);
            if (cid) {
                const cust = _allCustomers.find(c => c.id === cid);
                if (cust && (cust.lat || cust.address)) {
                    _invLocation = { lat: cust.lat, lng: cust.lng, address: cust.address };
                    document.getElementById('invLocation').value = cust.address || `${cust.lat}, ${cust.lng}`;
                }
            } else {
                _invLocation = null;
                document.getElementById('invLocation').value = '';
            }
        }

        function pickInvLocation() {
            if (typeof ARLocation !== 'undefined') {
                ARLocation.openMapModal(_invLocation, (res) => {
                    if (res) {
                        _invLocation = res;
                        document.getElementById('invLocation').value = res.address || `${res.lat}, ${res.lng}`;
                        UI.toast('تم تحديد موقع التسليم بنجاح', 'ok');
                    }
                });
            } else {
                UI.toast('تعذر تحميل الخريطة', 'warn');
            }
        }

        async function addInvLine() {
            const i = invLineCount++;
            const products = await ARDB.getAll('products');
            const tr = document.createElement('tr');
            tr.innerHTML =
                '<td>' +
                    '<select id="ilProd_' + i + '" class="il-prod" onchange="onInvProdChange(' + i + ')" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);">' +
                    '<option value="">— اختر —</option>' +
                    products.map(p => '<option value="' + p.id + '" data-price="' + (p.price || 0) + '" data-serials="' + (p.hasSerials ? '1' : '0') + '">' + p.name + (p.hasSerials ? ' (S/N)' : '') + '</option>').join('') +
                    '</select>' +
                    '<div id="ilSerialWrap_' + i + '" style="display:none;margin-top:6px;">' +
                        '<div style="font-size:0.75rem;color:var(--accent-cyan);margin-bottom:4px;">اختر السريالات المتاحة (S/N):</div>' +
                        '<select id="ilSerials_' + i + '" multiple style="width:100%;height:65px;padding:4px;font-size:0.8rem;border-radius:6px;border:1px solid var(--accent-purple);background:var(--card-dark);color:var(--text-primary);" onchange="onInvSerialsChange(' + i + ')"></select>' +
                    '</div>' +
                '</td>' +
                '<td><input id="ilQty_' + i + '" type="number" step="1" min="0" value="1" style="width:70px;padding:8px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);" oninput="recalcInv()"></td>' +
                '<td><input id="ilPrice_' + i + '" type="number" step="0.01" min="0" style="width:90px;padding:8px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);" oninput="recalcInv()"></td>' +
                '<td class="num" id="ilSub_' + i + '" style="font-weight:700;">0.00</td>' +
                '<td><button class="btn btn-sm btn-danger" onclick="this.closest(\'tr\').remove();recalcInv();"><i class="fa-solid fa-xmark"></i></button></td>';
            document.getElementById('invLinesBody').appendChild(tr);
        }

        async function onInvProdChange(i) {
            const sel = document.getElementById('ilProd_' + i);
            const wrap = document.getElementById('ilSerialWrap_' + i);
            const serialsSel = document.getElementById('ilSerials_' + i);
            if (!sel || !wrap) return;
            const opt = sel.options[sel.selectedIndex];
            if (opt && opt.dataset.serials === '1') {
                wrap.style.display = 'block';
                const pid = sel.value;
                const allSerials = await ARDB.getAll('serials');
                const avail = (allSerials || []).filter(s => String(s.productId) === String(pid) && s.status === 'available');
                serialsSel.innerHTML = avail.map(s => '<option value="' + s.id + '" data-sn="' + s.serialNumber + '">' + s.serialNumber + '</option>').join('');
                if (!avail.length) {
                    serialsSel.innerHTML = '<option value="" disabled>لا توجد سريالات متاحة في المخزن</option>';
                }
            } else {
                wrap.style.display = 'none';
            }
            recalcInv();
        }

        function onInvSerialsChange(i) {
            const serialsSel = document.getElementById('ilSerials_' + i);
            const qtyInput = document.getElementById('ilQty_' + i);
            if (serialsSel && qtyInput) {
                const selectedCount = Array.from(serialsSel.selectedOptions).filter(o => !o.disabled).length;
                if (selectedCount > 0) qtyInput.value = selectedCount;
            }
            recalcInv();
        }

        async function recalcInv() {
            let total = 0;
            document.querySelectorAll('#invLinesBody tr').forEach(tr => {
                const sel = tr.querySelector('select[id^="ilProd_"]');
                const qty = tr.querySelector('input[id^="ilQty_"]');
                const price = tr.querySelector('input[id^="ilPrice_"]');
                if (sel && price && qty) {
                    const oc = sel.options[sel.selectedIndex];
                    if (oc && oc.dataset.price && !price.value) price.value = oc.dataset.price;
                    const sub = (Number(qty.value) || 0) * (Number(price.value) || 0);
                    total += sub;
                    const subEl = tr.querySelector('[id^="ilSub_"]');
                    if (subEl) subEl.textContent = Number(sub).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }
            });
            document.getElementById('invTotal').textContent = total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function openInvModal() {
            document.getElementById('invModal').style.visibility = 'visible';
            document.getElementById('invModal').style.opacity = '1';
            document.getElementById('invDate').value = UI.todayInput();
            document.getElementById('invNote').value = '';
            document.getElementById('invPayType').value = 'cash';
            _invLocation = null;
            document.getElementById('invLocation').value = '';
            document.getElementById('invLinesBody').innerHTML = '';
            invLineCount = 0;
            recalcInv();
            await load();
        }
        function closeInvModal() {
            document.getElementById('invModal').style.visibility = 'hidden';
            document.getElementById('invModal').style.opacity = '0';
        }

        async function saveInvoice() {
            const dateVal = document.getElementById('invDate').value;
            const date = dateVal ? new Date(dateVal + 'T12:00:00').getTime() : Date.now();
            const customerId = document.getElementById('invCustomer').value || null;
            const paymentType = document.getElementById('invPayType').value || 'cash';
            const note = document.getElementById('invNote').value.trim();

            const items = [];
            let total = 0;
            const qtyCheck = {};
            const rows = document.querySelectorAll('#invLinesBody tr');
            for (let tr of rows) {
                const sel = tr.querySelector('select[id^="ilProd_"]');
                const qtyInput = tr.querySelector('input[id^="ilQty_"]');
                const priceInput = tr.querySelector('input[id^="ilPrice_"]');
                const serialsSel = tr.querySelector('select[id^="ilSerials_"]');

                if (sel && sel.value) {
                    const pid = sel.value;
                    const opt = sel.options[sel.selectedIndex];
                    const requiresSerials = opt && opt.dataset.serials === '1';
                    const q = Number(qtyInput.value) || 0;
                    const p = Number(priceInput.value) || 0;

                    let selectedSerialIds = [];
                    let selectedSerialSNs = [];
                    if (requiresSerials && serialsSel) {
                        const selOpts = Array.from(serialsSel.selectedOptions).filter(o => !o.disabled);
                        selectedSerialIds = selOpts.map(o => o.value);
                        selectedSerialSNs = selOpts.map(o => o.dataset.sn);

                        if (selectedSerialIds.length !== q) {
                            UI.toast('عدد السريالات المحددة (' + selectedSerialIds.length + ') لا يطابق الكمية المباعة (' + q + ')', 'warn');
                            return;
                        }
                    }

                    if (q > 0) {
                        const pr = await ARDB.getById('products', pid);
                        items.push({
                            productId: pid,
                            name: pr ? pr.name : (opt ? opt.text.split(' (')[0] : 'صنف'),
                            quantity: q,
                            price: p,
                            cost: pr ? (pr.cost || 0) : 0,
                            total: q * p,
                            serialIds: selectedSerialIds,
                            serials: selectedSerialSNs
                        });
                        total += q * p;
                        qtyCheck[pid] = (qtyCheck[pid] || 0) + q;
                    }
                }
            }
            if (!items.length) { UI.toast('أضف على الأقل صنفًا واحدًا', 'warn'); return; }

            // التحقق من توفر المخزون بمرونة وعرض تنبيه غير حاجب
            const movements = (await ARDB.getAll('stockMovements')) || [];
            for (const pid of Object.keys(qtyCheck)) {
                let available = 0;
                movements.forEach(m => {
                    if (m && m.productId != null && String(m.productId) === String(pid)) {
                        const mQty = (Number(m.quantity) || Number(m.qty) || 0);
                        available += mQty * (m.direction === 'in' ? 1 : -1);
                    }
                });
                if (available < qtyCheck[pid]) {
                    const p = await ARDB.getById('products', pid);
                    UI.toast('تنبيه: رصيد الصنف (' + (p ? p.name : 'المنتج') + ') بالمخزن حالياً (' + available + ')', 'warn');
                }
            }

            const number = await ARDB.nextSeq('invoice', 'INV-', 6);
            const invId = await ARDB.add('invoices', {
                number,
                date,
                customerId,
                paymentType,
                location: _invLocation,
                items,
                total,
                note,
                createdAt: Date.now()
            });

            // تحديث حالة السريالات المباعة
            const allSerialsList = await ARDB.getAll('serials');
            for (const it of items) {
                if (it.serialIds && it.serialIds.length) {
                    for (const sid of it.serialIds) {
                        await ARDB.update('serials', sid, { status: 'sold', invoiceId: invId, invoiceDate: date, updatedAt: Date.now() });
                    }
                } else if (it.serials && it.serials.length) {
                    for (const sn of it.serials) {
                        const rec = (allSerialsList || []).find(s => String(s.productId) === String(it.productId) && s.serialNumber && s.serialNumber.trim().toLowerCase() === String(sn).trim().toLowerCase());
                        if (rec) {
                            await ARDB.update('serials', rec.id, { status: 'sold', invoiceId: invId, invoiceDate: date, updatedAt: Date.now() });
                        } else {
                            await ARDB.add('serials', {
                                productId: it.productId,
                                serialNumber: sn,
                                status: 'sold',
                                invoiceId: invId,
                                invoiceDate: date,
                                createdAt: Date.now(),
                                updatedAt: Date.now()
                            });
                        }
                    }
                }
            }

            for (const it of items) {
                await ARDB.add('stockMovements', {
                    date,
                    productId: it.productId,
                    direction: 'out',
                    type: 'sale',
                    quantity: it.quantity,
                    note: 'فاتورة بيع ' + number
                });
            }

            // تسجيل الدفعة النقدية إن وجدت
            if (paymentType === 'cash' && customerId && total > 0) {
                await ARDB.add('payments', {
                    date,
                    type: 'receipt',
                    partyType: 'customer',
                    partyId: customerId,
                    amount: total,
                    method: 'cash',
                    note: 'سداد فاتورة بيع ' + number
                });
            }

            // تسجيل الإيراد في دفتر اليومية
            const incomeAccount = 11; // مبيعات
            const debitAccount = paymentType === 'credit' ? 4 : 3; // 4: مدينون/عملاء, 3: صندوق النقدية
            if (total > 0) {
                await ARDB.add('journalEntries', {
                    number: await ARDB.nextSeq('journalAuto', 'JRN-', 6),
                    date,
                    desc: 'فواتير بيع ' + number + (paymentType === 'credit' ? ' (آجل)' : ' (نقداً)'),
                    lines: [
                        { accountId: debitAccount, debit: total, credit: 0 },
                        { accountId: incomeAccount, debit: 0, credit: total }
                    ]
                });
            }

            UI.toast('تم حفظ الفاتورة ' + number + ' بنجاح', 'ok');
            closeInvModal();
            load();
        }

        async function printInvoice(id) {
            const inv = await ARDB.getById('invoices', id);
            if (!inv) return;
            const [settings, products, customers] = await Promise.all([ARDB.getAll('settings'), ARDB.getAll('products'), ARDB.getAll('customers')]);
            const s = {}; settings.forEach(r => { if (r && r.key) s[r.key] = r.value; });
            const pById = {}; products.forEach(p => pById[p.id] = p);
            const cust = inv.customerId ? customers.find(c => String(c.id) === String(inv.customerId)) : null;

            const rows = (inv.items || []).map(it => {
                const pid = it.productId || it.id;
                const pName = it.name || (pById[pid] ? pById[pid].name : 'صنف ' + pid);
                const qty = it.quantity || it.qty || 1;

                '@media print{body{margin:8mm;}}' +
                '</style></head><body>' +
                '<div class="head"><div><h1>' + (s.companyName || 'AR-Program') + '</h1>' +
                '<div style="font-size:12.5px;color:#475569;margin-top:4px;">' + (s.companyAddress ? '📍 ' + s.companyAddress + ' ' : '') + (s.companyPhone ? ' — 📞 ' + s.companyPhone : '') + '</div>' +

                (inv.paymentMethod ? '<td><b>طريقة الدفع:</b> ' + inv.paymentMethod + '</td>' : '') +

                '<div class="totals-box">' +

                (discountVal > 0 ? '<div class="totals-row" style="color:#d97706;"><span>الخصم المطبق:</span><b>-' + UI.money(discountVal) + ' ' + curr + '</b></div>' : '') +

            );
            win.document.close();
            win.focus();

        function generateCode39SVG(text, height = 38) {
            const code39Map = {
                '0': 'NNNWWNWNN', '1': 'WNNWNNNNW', '2': 'NNWWNNNNW', '3': 'WNWWNNNNN',
                '4': 'NNNWWNNNW', '5': 'WNNWWNNNN', '6': 'NNWWWNNNN', '7': 'NNNWNNWNW',
                '8': 'WNNWNNWNN', '9': 'NNWWNNWNN', 'A': 'WNNNNWNNW', 'B': 'NNWNNWNNW',
                'C': 'WNWNNWNNN', 'D': 'NNNNWWNNW', 'E': 'WNNNWWNNN', 'F': 'NNWNWWNNN',
                'G': 'NNNNNWWNW', 'H': 'WNNNNWWNN', 'I': 'NNWNNWWNN', 'J': 'NNNNWWWNN',
                'K': 'WNNNNNNWW', 'L': 'NNWNNNNWW', 'M': 'WNWNNNNWN', 'N': 'NNNNWNNWW',
                'O': 'WNNNWNNWN', 'P': 'NNWNWNNWN', 'Q': 'NNNNNNWWW', 'R': 'WNNNNNWWN',
                'S': 'NNWNNNWWN', 'T': 'NNNNWNWWN', 'U': 'WWNNNNNNW', 'V': 'NWWNNNNNW',
                'W': 'WWWNNNNNN', 'X': 'NWNNWNNNW', 'Y': 'WWNNWNNNN', 'Z': 'NWWNWNNNN',
                '-': 'NWNNNNWNW', '.': 'WWNNNNWNN', ' ': 'NWWNNNWWN', '*': 'NWNNWNWNN'
            };

            const str = String(text || '').toUpperCase().replace(/[^0-9A-Z\-\.\s]/g, '') || '0000';
            const cleanText = '*' + str + '*';
            const narrowWidth = 1.6;
            const wideWidth = 3.6;

            let bars = [];
            let x = 6;

            for (let i = 0; i < cleanText.length; i++) {
                const char = cleanText[i];
                const pattern = code39Map[char] || code39Map['*'];

                for (let p = 0; p < pattern.length; p++) {
                    const isBar = (p % 2 === 0);
                    const isWide = (pattern[p] === 'W');
                    const width = isWide ? wideWidth : narrowWidth;

                    if (isBar) {
                        bars.push('<rect x="' + x.toFixed(1) + '" y="0" width="' + width.toFixed(1) + '" height="' + height + '" fill="#000000" />');
                    }
                    x += width;
                }
                x += narrowWidth;
            }

            const totalWidth = Math.ceil(x + 6);
            return '<svg xmlns="http://www.w3.org/2000/svg" width="' + totalWidth + '" height="' + height + '" viewBox="0 0 ' + totalWidth + ' ' + height + '" style="display:block;margin:4px auto;max-width:100%;background:#ffffff;">' + bars.join('') + '</svg>';
        }

        async function printThermalInvoice(id) {
            const inv = await ARDB.getById('invoices', id);
            if (!inv) return;
            const [settings, products, customers] = await Promise.all([ARDB.getAll('settings'), ARDB.getAll('products'), ARDB.getAll('customers')]);
            const s = {}; settings.forEach(r => { if (r && r.key) s[r.key] = r.value; });
            const pById = {}; products.forEach(p => pById[p.id] = p);
            const cust = inv.customerId ? customers.find(c => String(c.id) === String(inv.customerId)) : null;

            const companyName = s.companyName || 'AR-Program';
            const companyAddress = s.companyAddress || '';
            const companyPhone = s.companyPhone || '';
            const taxNo = s.taxNo || '';
            const invNumber = inv.number || ('INV-' + inv.id);
            const invDateObj = new Date(inv.date || Date.now());
            const YYYY = invDateObj.getFullYear();
            const MM = String(invDateObj.getMonth() + 1).padStart(2, '0');
            const DD = String(invDateObj.getDate()).padStart(2, '0');
            const invDateStr = `${YYYY}/${MM}/${DD}`;

            let hh = invDateObj.getHours();
            const mm = String(invDateObj.getMinutes()).padStart(2, '0');
            const ampm = hh >= 12 ? 'م' : 'ص';
            hh = hh % 12 || 12;
            const invTimeStr = `${hh}:${mm} ${ampm}`;

            const customerName = cust ? cust.name : 'عميل عام (نقدي)';
            const customerPhone = cust && cust.phone ? cust.phone : '';
            const customerAddress = cust && cust.address ? cust.address : '';
            const cashierName = inv.cashierName || 'المستخدم';

            const subTotal = inv.subtotal || inv.total || 0;
            const discountAmount = inv.discount || inv.discountAmount || 0;
            const discountType = inv.discountType || 'fixed';
            const discountValue = inv.discountValue || 0;
            const grandTotal = inv.total || 0;

            const invItems = (inv.items || []).map(it => {
                const pid = it.productId || it.id;
                const pName = it.name || (pById[pid] ? pById[pid].name : 'صنف ' + pid);
                const qty = it.quantity || it.qty || 1;
                const price = Number(it.price || 0);
                const tot = Number(it.total || (price * qty));
                const serials = it.serials || [];
                return { name: pName, quantity: qty, price: price, total: tot, serials: serials };
            });

            const payMethodSummary = inv.paymentMethod || (inv.paymentType === 'credit' ? 'آجل' : 'نقداً (كاش)');

            const receiptHtml = `
                <div style="font-family:'Courier New', Monaco, 'Lucida Console', monospace;font-size:10px;font-weight:800;color:#000000 !important;-webkit-font-smoothing:none;line-height:1.3;direction:rtl;text-align:right;width:100%;box-sizing:border-box;background:#ffffff;padding:1px;">
                    <!-- الترويسة الرئيسية للمحل/الشركة -->
                    <div style="text-align:center;padding-bottom:4px;margin-bottom:4px;border-bottom:2px solid #000000;">
                        <div style="font-size:13.5px;font-weight:900;margin-bottom:2px;color:#000000 !important;">${companyName}</div>
                        ${companyAddress ? `<div style="font-size:9.5px;font-weight:800;margin-bottom:1px;color:#000000 !important;">📍 ${companyAddress}</div>` : ''}
                        ${companyPhone ? `<div style="font-size:9.5px;font-weight:800;margin-bottom:1px;color:#000000 !important;">📞 ${companyPhone}</div>` : ''}
                        ${taxNo ? `<div style="font-size:9.5px;font-weight:800;margin-bottom:1px;color:#000000 !important;">الرقم الضريبي: ${taxNo}</div>` : ''}
                        <div style="font-size:10.5px;font-weight:900;margin-top:3px;background:#ffffff;color:#000000 !important;padding:2px 0;border-radius:2px;border:1.5px solid #000000;">إيصال مبيعات (حراري)</div>
                    </div>

                    <!-- تفاصيل الفاتورة -->
                    <table style="width:100%;font-size:9.5px;font-weight:800;color:#000000 !important;margin-bottom:4px;border-collapse:collapse;line-height:1.4;">
                        <tr>
                            <td style="padding:1px 0;color:#000000 !important;"><b>رقم الفاتورة:</b> ${invNumber}</td>
                        </tr>
                        <tr>
                            <td style="padding:1px 0;color:#000000 !important;"><b>المستخدم / الكاشير:</b> ${cashierName}</td>
                        </tr>
                        <tr>
                            <td style="padding:1px 0;color:#000000 !important;"><b>تاريخ الفاتورة:</b> ${invDateStr}</td>
                        </tr>
                        <tr>
                            <td style="padding:1px 0;color:#000000 !important;"><b>وقت الفاتورة:</b> ${invTimeStr}</td>
                        </tr>
                        <tr>
                            <td style="padding:1px 0;color:#000000 !important;"><b>العميل:</b> ${customerName} ${customerPhone ? '(' + customerPhone + ')' : ''}</td>
                        </tr>
                        ${customerAddress ? `<tr><td style="padding:1px 0;color:#000000 !important;"><b>العنوان:</b> ${customerAddress}</td></tr>` : ''}
                        <tr>
                            <td style="padding:1px 0;color:#000000 !important;"><b>طريقة الدفع:</b> ${payMethodSummary}</td>
                        </tr>
                    </table>

                    <div style="border-top:1.5px solid #000000;margin:4px 0;"></div>

                    <!-- جدول الأصناف -->
                    <table style="width:100%;font-size:10px;font-weight:800;color:#000000 !important;border-collapse:collapse;margin-bottom:4px;">
                        <thead>
                            <tr style="border-bottom:2px solid #000000;font-size:10px;">
                                <th style="text-align:right;padding:2px 0;width:45%;color:#000000 !important;">الصنف</th>
                                <th style="text-align:center;padding:2px 0;width:30%;color:#000000 !important;">ك × سعر</th>
                                <th style="text-align:left;padding:2px 0;width:25%;color:#000000 !important;">الإجمالي</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${invItems.map(c => `
                                <tr style="border-bottom:1px dashed #000000;">
                                    <td style="padding:2px 0;vertical-align:top;color:#000000 !important;">
                                        <div style="font-weight:900;font-size:10px;color:#000000 !important;">${c.name}</div>
                                        ${(c.serials && c.serials.length) ? `<div style="font-size:9px;font-weight:800;color:#000000 !important;margin-top:1px;">S/N: ${c.serials.join(', ')}</div>` : ''}
                                    </td>
                                    <td style="text-align:center;padding:2px 0;vertical-align:top;font-size:9px;color:#000000 !important;">${c.quantity} × ${c.price.toFixed(2)}</td>
                                    <td style="text-align:left;font-weight:900;padding:2px 0;vertical-align:top;font-size:10px;color:#000000 !important;">${c.total.toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <div style="border-top:1.5px solid #000000;margin:4px 0;"></div>

                    <!-- الملخص المالي والخصم -->
                    <table style="width:100%;font-size:10px;font-weight:800;color:#000000 !important;margin-bottom:4px;">
                        <tr>
                            <td style="padding:1px 0;color:#000000 !important;">المجموع الفرعي:</td>
                            <td style="text-align:left;font-weight:900;padding:1px 0;color:#000000 !important;">${subTotal.toFixed(2)} ج.م</td>
                        </tr>
                        ${discountAmount > 0 ? `
                        <tr style="color:#000000 !important;">
                            <td style="padding:1px 0;color:#000000 !important;">الخصم المطبق ${discountType === 'percent' ? '(' + discountValue + '%)' : ''}:</td>
                            <td style="text-align:left;font-weight:900;padding:1px 0;color:#000000 !important;">-${discountAmount.toFixed(2)} ج.م</td>
                        </tr>
                        ` : ''}
                        <tr style="font-size:13px;font-weight:900;color:#000000 !important;border-top:2px solid #000000;border-bottom:3px double #000000;">
                            <td style="padding:4px 0;color:#000000 !important;">الإجمالي النهائي:</td>
                            <td style="text-align:left;padding:4px 0;color:#000000 !important;">${grandTotal.toFixed(2)} ج.م</td>
                        </tr>
                    </table>

                    <!-- تذييل الفاتورة والسياسات والباركوود -->
                    <div style="text-align:center;font-size:9.5px;font-weight:800;color:#000000 !important;margin-top:6px;padding-top:4px;border-top:1.5px dashed #000000;">
                        <div style="margin-bottom:2px;font-weight:900;font-size:10.5px;color:#000000 !important;">${s.invoiceNote || 'شكراً لزيارتكم وسعداء بملء ثقتكم!'}</div>
                        <div style="font-size:8.5px;font-weight:800;color:#000000 !important;">الاسترجاع والاستبدال خلال 14 يوماً بموجب الفاتورة الأصلية</div>
                        <div style="margin-top:6px;background:#ffffff;padding:2px 0;">${generateCode39SVG(invNumber)}</div>
                        <div style="font-family:monospace;font-size:10px;font-weight:900;margin-top:2px;color:#000000 !important;">* ${invNumber} *</div>
                    </div>

                    <!-- مسافة التلقيم الخاصة بقطع القص التلقائي للمقص (25mm Paper Feed for Cutter Blade) -->
                    <div style="height:25mm;width:100%;page-break-after:always;break-after:page;display:block;"></div>
                </div>
            `;

            let area = document.getElementById('thermalPrintArea');
            if (!area) {
                area = document.createElement('div');
                area.id = 'thermalPrintArea';
                document.body.appendChild(area);
            }
            area.innerHTML = receiptHtml;

            setTimeout(() => {
                try {
                    window.print();
                } catch(e) {
                    console.warn('window.print thermal error:', e);
                    const win = window.open('', '_blank', 'width=380,height=650');
                    if (win) {
                        win.document.write('<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>طباعة إيصال حراري</title><style>@page{size:80mm auto;margin:0mm;}body{margin:0;padding:3mm;font-family:"Courier New",sans-serif;font-size:11.5px;direction:rtl;text-align:right;}</style></head><body>' + receiptHtml + '<script>window.onload=function(){setTimeout(function(){window.print();},200);};<\/script></body></html>');
                        win.document.close();
                    }
                }
            }, 150);
        }

        async function delInvoice(id) {
            const ok = await UI.confirmBox('حذف الفاتورة؟ لن تُلغى حركات المخزون المرتبطة تلقائيًا.');
            if (!ok) return;
            await ARDB.remove('invoices', id);
            UI.toast('تم الحذف', 'ok');
            load();
        }

        load();
    </script>
    <div id="thermalPrintArea"></div>
