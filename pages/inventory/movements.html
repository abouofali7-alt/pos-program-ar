<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حركات المخزون — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>
    <main class="pagewrap" style="padding:22px;max-width:1200px;margin:0 auto;">
        <div class="page-head">
            <div>
                <h2>حركات المخزون</h2>
                <div class="sub">الإدخال والإخراج والتسوية</div>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary-soft" onclick="openMoveModal()"><i class="fa-solid fa-plus"></i> حركة جديدة</button>
            </div>
        </div>
        <div class="table-card">
            <div class="table-head">سجل الحركات</div>
            <div class="table-scroll">
                <table class="data-table">
                    <thead><tr><th>التاريخ</th><th>المنتج</th><th>النوع</th><th>الاتجاه</th><th>الكمية</th><th>الملاحظة</th><th></th></tr></thead>
                    <tbody id="movBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="moveModal" class="modal-mask" style="visibility:hidden;opacity:0;">
        <div class="modal-box">
            <h3>حركة مخزون</h3>
            <div class="form-grid">
                <div class="form-item"><label>التاريخ</label><input type="date" id="mDate"></div>
                <div class="form-item"><label>المنتج</label><select id="mProduct"></select></div>
                <div class="form-item"><label>الاتجاه</label>
                    <select id="mDirection"><option value="in">إدخال</option><option value="out">إخراج</option></select>
                </div>
                <div class="form-item"><label>النوع (سبب الحركة)</label>
                    <select id="mType">
                        <option value="purchase">شراء</option>
                        <option value="sale">بيع</option>
                        <option value="adjust">تسوية</option>
                        <option value="transfer">تحويل</option>
                        <option value="return">مرتجع</option>
                    </select>
                </div>
                <div class="form-item"><label>الكمية</label><input type="number" id="mQty" step="1" min="0"></div>
                <div class="form-item"><label>الملاحظة</label><input id="mNote"></div>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn btn-secondary" onclick="closeMoveModal()">إلغاء</button>
                <button class="btn btn-primary-soft" onclick="saveMove()">حفظ</button>
            </div>
        </div>
    </div>

    <script src="../../js/ui.js"></script>
    <script src="../../js/db.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        async function load() {
            const [products, moves] = await Promise.all([ARDB.getAll('products'), ARDB.getAll('stockMovements')]);
            const prodById = {}; products.forEach(p => prodById[p.id] = p);
            const sorted = moves.sort((a, b) => (b.date || 0) - (a.date || 0));
            const sel = document.getElementById('mProduct');
            sel.innerHTML = '<option value="">— اختر —</option>' + products.map(p => '<option value="' + p.id + '">' + p.name + '</option>').join('');
            const typeNames = { purchase: 'شراء', sale: 'بيع', adjust: 'تسوية', transfer: 'تحويل', return: 'مرتجع' };
            document.getElementById('movBody').innerHTML = sorted.map(m => {
                const p = prodById[m.productId];
                return '<tr>' +
                    '<td>' + UI.date(m.date) + '</td>' +
                    '<td>' + (p ? p.name : 'منتج #' + m.productId) + '</td>' +
                    '<td>' + (typeNames[m.type] || m.type) + '</td>' +
                    '<td>' + (m.direction === 'in'
                        ? '<span class="badge badge-green"><i class="fa-solid fa-arrow-up"></i> إدخال</span>'
                        : '<span class="badge badge-red"><i class="fa-solid fa-arrow-down"></i> إخراج</span>') + '</td>' +
                    '<td class="num" style="font-weight:700;">' + m.quantity + '</td>' +
                    '<td>' + (m.note || '') + '</td>' +
                    '<td style="text-align:left;"><button class="btn btn-sm btn-danger" onclick="delMove(' + m.id + ')"><i class="fa-solid fa-trash"></i></button></td>' +
                    '</tr>';
            }).join('') || '<tr><td colspan="7" class="empty-state">لا توجد حركات</td></tr>';
        }
        function openMoveModal() {
            document.getElementById('mDate').value = UI.todayInput();
            document.getElementById('mProduct').value = '';
            document.getElementById('mDirection').value = 'in';
            document.getElementById('mType').value = 'purchase';
            document.getElementById('mQty').value = '';
            document.getElementById('mNote').value = '';
            document.getElementById('moveModal').style.visibility = 'visible';
            document.getElementById('moveModal').style.opacity = '1';
        }
        function closeMoveModal() {
            document.getElementById('moveModal').style.visibility = 'hidden';
            document.getElementById('moveModal').style.opacity = '0';
        }
        async function saveMove() {
            const date = new Date(document.getElementById('mDate').value + 'T12:00:00').getTime();
            const productId = Number(document.getElementById('mProduct').value);
            const direction = document.getElementById('mDirection').value;
            const type = document.getElementById('mType').value;
            const quantity = Number(document.getElementById('mQty').value) || 0;
            const note = document.getElementById('mNote').value.trim();
            if (!productId) { UI.toast('اختر المنتج', 'warn'); return; }
            if (quantity <= 0) { UI.toast('أدخل كمية صحيحة', 'warn'); return; }
            await ARDB.add('stockMovements', { date, productId, direction, type, quantity, note });
            UI.toast('تمت الحركة', 'ok');
            closeMoveModal(); load();
        window.addEventListener('ar_cloud_data_updated', load);
        }
        async function delMove(id) {
            const ok = await UI.confirmBox('حذف الحركة؟');
            if (!ok) return;
            await ARDB.remove('stockMovements', id);
            UI.toast('تم الحذف', 'ok'); load();
        }
        load();
    </script>
</body>
</html>
