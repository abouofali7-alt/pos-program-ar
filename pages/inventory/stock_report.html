<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير الأرصدة — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>
    <main class="pagewrap" style="padding:22px;max-width:1200px;margin:0 auto;">
        <div class="page-head">
            <div>
                <h2>تقرير أرصدة المخزون</h2>
                <div class="sub">طباعة أو نسخ التقرير</div>
            </div>
            <div class="page-actions">
                <button class="btn" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة</button>
            </div>
        </div>
        <div class="table-card">
            <div class="table-head" id="repTitle">تقرير الأرصدة</div>
            <div class="table-scroll">
                <table class="data-table">
                    <thead><tr><th>المنتج</th><th>التصنيف</th><th>الكمية</th><th>سعر التكلفة</th><th>قيمة الرصيد</th><th>سعر البيع</th></tr></thead>
                    <tbody id="repBody"></tbody>
                    <tfoot id="repFoot"></tfoot>
                </table>
            </div>
        </div>
    </main>

    <script src="../../js/ui.js"></script>
    <script src="../../js/db.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        if (typeof window !== 'undefined') {
            window.addEventListener('ar_cloud_data_updated', () => {
                try { load(); } catch(e){}
            });
        }

        async function load() {
            const [categories, products, movements] = await Promise.all([
                ARDB.getAll('categories'), ARDB.getAll('products'), ARDB.getAll('stockMovements')
            ]);
            const catById = {}; categories.forEach(c => catById[c.id] = c);
            const qty = {}; products.forEach(p => qty[String(p.id)] = 0);
            (movements || []).forEach(m => {
                if (m && m.productId != null) {
                    const mKey = String(m.productId);
                    if (qty[mKey] !== undefined) {
                        const mQty = (Number(m.quantity) || Number(m.qty) || 0);
                        qty[mKey] += mQty * (m.direction === 'in' ? 1 : -1);
                    }
                }
            });

            let valueTotal = 0;
            const rows = products.map(p => {
                const q = qty[String(p.id)] || 0;
                const v = q * (p.cost || 0);
                valueTotal += v;
                return '<tr><td>' + p.name + '</td>' +
                    '<td>' + (p.categoryId && catById[p.categoryId] ? catById[p.categoryId].name : '—') + '</td>' +
                    '<td class="num">' + q + '</td>' +
                    '<td class="num">' + UI.money(p.cost || 0) + '</td>' +
                    '<td class="num" style="font-weight:700;">' + UI.money(v) + '</td>' +
                    '<td class="num">' + UI.money(p.price || 0) + '</td></tr>';
            });
            document.getElementById('repBody').innerHTML = rows.join('') || '<tr><td colspan="6" class="empty-state">لا توجد منتجات</td></tr>';
            document.getElementById('repFoot').innerHTML = '<tr style="background:var(--card-hover);font-weight:800;"><td colspan="4">القيمة الإجمالية للمخزون</td><td class="num">' + UI.money(valueTotal) + '</td><td></td></tr>';
        }
        load();
    </script>
</body>
</html>
