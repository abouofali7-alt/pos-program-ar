<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>
    <main class="pagewrap" style="padding:22px;max-width:1200px;margin:0 auto;">
        <div class="page-head">
            <div>
                <h2>المنتجات</h2>
                <div class="sub">إدارة الأصناف والأسعار</div>
            </div>
            <div class="page-actions" style="display:flex;gap:8px;">
                <button class="btn btn-secondary" onclick="ARExport.tableToCSV('productsTable', 'المنتجات')"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
                <button class="btn btn-secondary" onclick="ARExport.printTable('productsTable', 'جدول المنتجات')"><i class="fa-solid fa-print"></i> طباعة</button>
                <button class="btn btn-primary-soft" onclick="openProductModal()"><i class="fa-solid fa-plus"></i> إضافة منتج</button>
            </div>
        </div>
        <div class="table-card">
            <div class="table-head">قائمة المنتجات</div>
            <div class="table-scroll">
                <table class="data-table" id="productsTable">
                    <thead><tr><th>الاسم</th><th>الباركود</th><th>التصنيف</th><th>الوحدة</th><th>سعر التكلفة</th><th>سعر البيع</th><th>الرصيد</th><th></th></tr></thead>
                    <tbody id="prodBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="prodModal" class="modal-mask" style="visibility:hidden;opacity:0;">
        <div class="modal-box">
            <h3 id="prodModalTitle">إضافة منتج</h3>
            <div class="form-grid">
                <div class="form-item"><label>اسم المنتج *</label><input id="pName"></div>
                <div class="form-item"><label>الباركود</label><input id="pBarcode"></div>
                <div class="form-item"><label>التصنيف</label><select id="pCategory"></select></div>
                <div class="form-item"><label>الوحدة</label><input id="pUnit" placeholder="قطعة"></div>
                <div class="form-item"><label>سعر التكلفة</label><input type="number" id="pCost" step="0.01" min="0"></div>
                <div class="form-item"><label>سعر البيع</label><input type="number" id="pPrice" step="0.01" min="0"></div>
                <div class="form-item"><label>الرصيد الابتدائي (الكمية الحالية)</label><input type="number" id="pInitialStock" step="1" min="0" placeholder="0"></div>
                <div class="form-item"><label>حد أدنى للمخزون</label><input type="number" id="pMinStock" step="1" min="0"></div>
                <div class="form-item" style="grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:6px;">
                    <input type="checkbox" id="pHasSerials" style="width:18px;height:18px;cursor:pointer;">
                    <label for="pHasSerials" style="margin:0;cursor:pointer;font-weight:600;color:var(--accent-cyan);"><i class="fa-solid fa-barcode"></i> تتبع الأرقام التسلسلية (S/N) لهذا المنتج</label>
                </div>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn btn-secondary" onclick="closeProductModal()">إلغاء</button>
                <button class="btn btn-primary-soft" onclick="saveProduct()">حفظ</button>
            </div>
        </div>
    </div>

    <!-- modal عرض واستعراض السريالات الخاص بالمنتج -->
    <div id="serialsModal" class="modal-mask" style="visibility:hidden;opacity:0;">
        <div class="modal-box" style="width:min(680px,94vw);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <h3 id="serialsModalTitle" style="margin:0;"><i class="fa-solid fa-barcode" style="color:var(--accent-cyan);"></i> الأرقام التسلسلية للمنتج</h3>
                <button class="icon-btn" onclick="closeSerialsModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="table-scroll" style="max-height:360px;">
                <table class="data-table">
                    <thead><tr><th>الرقم التسلسلي S/N</th><th>الحالة</th><th>تاريخ الشراء</th><th>تاريخ البيع</th></tr></thead>
                    <tbody id="serialsBody"></tbody>
                </table>
            </div>
            <div style="display:flex;justify-content:flex-end;margin-top:14px;">
                <button class="btn btn-secondary" onclick="closeSerialsModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <script src="../../js/ui.js"></script>
    <script src="../../js/db.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        let editingPid = null;

        function stockOf(products, movements, pid) {
            let q = 0;
            movements.forEach(m => { if (m.productId === pid) q += (m.quantity || 0) * (m.direction === 'in' ? 1 : -1); });
            return q;
        }

        async function load() {
            const [categories, products, movements] = await Promise.all([
                ARDB.getAll('categories'), ARDB.getAll('products'), ARDB.getAll('stockMovements')
            ]);
            const catById = {}; categories.forEach(c => catById[c.id] = c);
            const catSel = document.getElementById('pCategory');
            catSel.innerHTML = '<option value="">— بدون تصنيف —</option>' + categories.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('');

            const body = document.getElementById('prodBody');
            body.innerHTML = products.map(p => {
                const q = stockOf(products, movements, p.id);
                const low = q <= (p.minStock || 0);
                const snBadge = p.hasSerials ? ' <span class="badge badge-purple" style="font-size:0.7rem;"><i class="fa-solid fa-barcode"></i> S/N</span>' : '';
                return '<tr>' +
                    '<td>' + p.name + snBadge + '</td>' +
                    '<td class="num">' + (p.barcode || '—') + '</td>' +
                    '<td>' + (p.categoryId && catById[p.categoryId] ? catById[p.categoryId].name : '—') + '</td>' +
                    '<td>' + (p.unit || 'قطعة') + '</td>' +
                    '<td class="num">' + UI.money(p.cost || 0) + '</td>' +
                    '<td class="num" style="color:var(--success);">' + UI.money(p.price || 0) + '</td>' +
                    '<td class="num" style="font-weight:700;color:' + (low ? 'var(--danger)' : 'var(--text-primary)') + ';">' + q + (low ? ' <span class="badge badge-red">منخفض</span>' : '') + '</td>' +
                    '<td style="text-align:left;white-space:nowrap;">' +
                        (p.hasSerials ? '<button class="btn btn-sm btn-secondary" title="عرض السريالات" onclick="viewSerials(' + p.id + ')"><i class="fa-solid fa-barcode"></i></button> ' : '') +
                        '<button class="btn btn-sm" onclick="editProduct(' + p.id + ')"><i class="fa-solid fa-pen"></i></button> ' +
                        '<button class="btn btn-sm btn-danger" onclick="delProduct(' + p.id + ')"><i class="fa-solid fa-trash"></i></button>' +
                    '</td></tr>';
            }).join('') || '<tr><td colspan="8" class="empty-state">لا توجد منتجات</td></tr>';
        }

        function openProductModal() {
            editingPid = null;
            document.getElementById('prodModalTitle').textContent = 'إضافة منتج';
            ['pName','pBarcode','pUnit','pCost','pPrice','pInitialStock','pMinStock'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('pCategory').value = '';
            document.getElementById('pHasSerials').checked = false;
            document.getElementById('prodModal').style.visibility = 'visible';
            document.getElementById('prodModal').style.opacity = '1';
        }
        function closeProductModal() {
            document.getElementById('prodModal').style.visibility = 'hidden';
            document.getElementById('prodModal').style.opacity = '0';
        }
        async function editProduct(id) {
            const p = await ARDB.getById('products', id);
            if (!p) return;
            editingPid = id;
            document.getElementById('prodModalTitle').textContent = 'تعديل منتج';
            document.getElementById('pName').value = p.name || '';
            document.getElementById('pBarcode').value = p.barcode || '';
            document.getElementById('pCategory').value = p.categoryId || '';
            document.getElementById('pUnit').value = p.unit || '';
            document.getElementById('pCost').value = p.cost || '';
            document.getElementById('pPrice').value = p.price || '';
            document.getElementById('pInitialStock').value = '';
            document.getElementById('pMinStock').value = p.minStock || 0;
            document.getElementById('pHasSerials').checked = !!p.hasSerials;
            document.getElementById('prodModal').style.visibility = 'visible';
            document.getElementById('prodModal').style.opacity = '1';
        }
        async function saveProduct() {
            const name = document.getElementById('pName').value.trim();
            if (!name) { UI.toast('اسم المنتج مطلوب', 'warn'); return; }
            const initialStock = Number(document.getElementById('pInitialStock').value) || 0;
            const rec = {
                name,
                barcode: document.getElementById('pBarcode').value.trim(),
                categoryId: document.getElementById('pCategory').value ? Number(document.getElementById('pCategory').value) : null,
                unit: document.getElementById('pUnit').value.trim() || 'قطعة',
                cost: Number(document.getElementById('pCost').value) || 0,
                price: Number(document.getElementById('pPrice').value) || 0,
                minStock: Number(document.getElementById('pMinStock').value) || 0,
                hasSerials: document.getElementById('pHasSerials').checked
            };
            if (editingPid) {
                rec.id = editingPid;
                await ARDB.put('products', rec);
                UI.toast('تم التعديل', 'ok');
            } else {
                const newId = await ARDB.add('products', rec);
                if (initialStock > 0) {
                    await ARDB.add('stockMovements', {
                        date: Date.now(),
                        productId: newId,
                        direction: 'in',
                        type: 'initial',
                        quantity: initialStock,
                        note: 'رصيد أول المدة'
                    });
                }
                UI.toast('تمت الإضافة', 'ok');
            }
            closeProductModal();
            load();
        }
        async function delProduct(id) {
            const ok = await UI.confirmBox('حذف المنتج؟ (لن تُحذف الحركات المرتبطة)');
            if (!ok) return;
            await ARDB.remove('products', id);
            UI.toast('تم الحذف', 'ok');
            load();
        }

        async function viewSerials(pid) {
            const p = await ARDB.getById('products', pid);
            if (!p) return;
            document.getElementById('serialsModalTitle').innerHTML = '<i class="fa-solid fa-barcode" style="color:var(--accent-cyan);"></i> السريالات: ' + p.name;
            const allSerials = await ARDB.getAll('serials');
            const prodSerials = (allSerials || []).filter(s => s.productId === pid);
            
            const tbody = document.getElementById('serialsBody');
            if (!prodSerials.length) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-state">لا توجد أرقام تسلسلية مسجلة لهذا المنتج</td></tr>';
            } else {
                tbody.innerHTML = prodSerials.map(s => {
                    let stBadge = '<span class="badge badge-green">متاح بالمخزن</span>';
                    if (s.status === 'sold') stBadge = '<span class="badge badge-amber">مباع</span>';
                    else if (s.status === 'purchase_returned') stBadge = '<span class="badge badge-red">مرتجع للمورد</span>';
                    else if (s.status === 'returned') stBadge = '<span class="badge badge-blue">مرتجع للمخزن</span>';
                    return '<tr>' +
                        '<td class="num" style="font-weight:700;letter-spacing:0.5px;">' + s.serialNumber + '</td>' +
                        '<td>' + stBadge + '</td>' +
                        '<td>' + (s.purchaseDate ? UI.date(s.purchaseDate) : '—') + '</td>' +
                        '<td>' + (s.invoiceDate ? UI.date(s.invoiceDate) : '—') + '</td>' +
                        '</tr>';
                }).join('');
            }

            document.getElementById('serialsModal').style.visibility = 'visible';
            document.getElementById('serialsModal').style.opacity = '1';
        }

        function closeSerialsModal() {
            document.getElementById('serialsModal').style.visibility = 'hidden';
            document.getElementById('serialsModal').style.opacity = '0';
        }

        load();
    </script>
</body>
</html>
