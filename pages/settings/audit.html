<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الأنشطة والأمان — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>

    <main class="pagewrap" style="padding:22px;max-width:1100px;margin:0 auto;">
        <div class="page-head">
            <div>
                <h2><i class="fa-solid fa-shield-halved" style="color:var(--accent-cyan);"></i> سجل الأنشطة والأمان (Audit Trail)</h2>
                <div class="sub">متابعة دقيقة لكافة العمليات والإجراءات المنفذة في النظام</div>
            </div>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-secondary" onclick="ARExport.tableToCSV('auditTable', 'سجل_الأنشطة')"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
                <button class="btn btn-secondary" onclick="clearAllLogs()" style="color:var(--danger);"><i class="fa-solid fa-trash-can"></i> تفريغ السجل</button>
            </div>
        </div>

        <div class="table-card">
            <div class="table-head">سجل العمليات الإدارية والأمنية</div>
            <div class="table-scroll">
                <table class="data-table" id="auditTable">
                    <thead>
                        <tr>
                            <th>التاريخ والوقت</th>
                            <th>المستخدم</th>
                            <th>الإجراء (Action)</th>
                            <th>الوحدة (Module)</th>
                            <th>التفاصيل</th>
                            <th>عنوان IP</th>
                        </tr>
                    </thead>
                    <tbody id="auditBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../../js/ui.js">    window.addEventListener('ar_cloud_data_updated', () => { if (typeof load === 'function') load(); });
    </script>
    <script src="../../js/db.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/audit.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        function loadAuditLogs() {
            const logs = ARAudit.getLogs();
            const tbody = document.getElementById('auditBody');
            if (!logs.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">لا توجد سجلات أنشطة مسجلة حالياً</td></tr>';
                return;
            }

            tbody.innerHTML = logs.map(l => `
                <tr>
                    <td class="num">${UI.datetime(l.timestamp)}</td>
                    <td><b>${l.user}</b></td>
                    <td><span class="badge badge-purple">${l.action}</span></td>
                    <td><span class="badge badge-cyan">${l.module}</span></td>
                    <td style="font-size:0.85rem;color:var(--text-secondary);">${l.details || '—'}</td>
                    <td class="num">${l.ip || '127.0.0.1'}</td>
                </tr>
            `).join('');
        }

        async function clearAllLogs() {
            const ok = await UI.confirmBox('هل أنت تأكد من تفريغ سجل الأنشطة والأمان بالكامل؟');
            if (ok) {
                ARAudit.clearLogs();
                loadAuditLogs();
                UI.toast('تم تفريغ السجل', 'ok');
            }
        }

        loadAuditLogs();
    </script>
</body>
</html>
