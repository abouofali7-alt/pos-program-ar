<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموظفون — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>
    <main class="pagewrap" style="padding:22px;max-width:1200px;margin:0 auto;">
        <div class="page-head">
            <div>
                <h2>الموظفون</h2>
                <div class="sub">إدارة سجل الموظفين والرواتب الأساسية</div>
            </div>
            <div class="page-actions" style="display:flex;gap:8px;">
                <button class="btn btn-secondary" onclick="ARExport.tableToCSV('empTable', 'الموظفون')"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
                <button class="btn btn-secondary" onclick="ARExport.printTable('empTable', 'سجل الموظفين')"><i class="fa-solid fa-print"></i> طباعة</button>
                <button class="btn btn-primary-soft" onclick="openEmpModal()"><i class="fa-solid fa-plus"></i> إضافة موظف</button>
            </div>
        </div>
        <div class="table-card">
            <div class="table-head">الموظفون</div>
            <div class="table-scroll">
                <table class="data-table" id="empTable">
                    <thead><tr><th>الاسم</th><th>القسم</th><th>الوظيفة</th><th>الهاتف</th><th>الراتب الأساسي</th><th>تاريخ التعيين</th><th>الحالة</th><th></th></tr></thead>
                    <tbody id="empBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="empModal" class="modal-mask" style="visibility:hidden;opacity:0;">
        <div class="modal-box">
            <h3 id="empModalTitle">إضافة موظف</h3>
            <div class="form-grid">
                <div class="form-item"><label>الاسم</label><input id="eName"></div>
                <div class="form-item"><label>القسم</label><select id="eDept"></select></div>
                <div class="form-item"><label>الوظيفة</label><input id="ePosition"></div>
                <div class="form-item"><label>الهاتف</label><input id="ePhone"></div>
                <div class="form-item"><label>الراتب الأساسي</label><input type="number" id="eSalary" step="0.01" min="0"></div>
                <div class="form-item"><label>تاريخ التعيين</label><input type="date" id="eHireDate"></div>
                <div class="form-item"><label>ملاحظات</label><input id="eNotes"></div>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button class="btn btn-secondary" onclick="closeEmpModal()">إلغاء</button>
                <button class="btn btn-primary-soft" onclick="saveEmp()">حفظ</button>
            </div>
        </div>
    </div>

    <script src="../../js/ui.js"></script>
    <script src="../../js/db.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        let editingEid = null;
        async function load() {
            const [employees, departments] = await Promise.all([ARDB.getAll('employees'), ARDB.getAll('departments')]);
            const deptById = {}; departments.forEach(d => deptById[d.id] = d);
            const sel = document.getElementById('eDept');
            sel.innerHTML = '<option value="">— بدون قسم —</option>' + departments.map(d => '<option value="' + d.id + '">' + d.name + '</option>').join('');

            document.getElementById('empBody').innerHTML = employees.map(e =>
                '<tr><td><b>' + e.name + '</b></td>' +
                '<td>' + (e.departmentId && deptById[e.departmentId] ? deptById[e.departmentId].name : '—') + '</td>' +
                '<td>' + (e.position || '—') + '</td>' +
                '<td class="num">' + (e.phone || '—') + '</td>' +
                '<td class="num" style="font-weight:700;">' + UI.money(e.salary || 0) + '</td>' +
                '<td>' + (e.hireDate ? UI.date(new Date(e.hireDate + 'T12:00:00').getTime()) : '—') + '</td>' +
                '<td>' + (e.active === false ? '<span class="badge badge-red">موقوف</span>' : '<span class="badge badge-green">نشط</span>') + '</td>' +
                '<td style="text-align:left;white-space:nowrap;">' +
                '<button class="btn btn-sm" onclick="editEmp(' + e.id + ')"><i class="fa-solid fa-pen"></i></button> ' +
                '<button class="btn btn-sm btn-danger" onclick="delEmp(' + e.id + ')"><i class="fa-solid fa-trash"></i></button></td></tr>'
            ).join('') || '<tr><td colspan="8" class="empty-state">لا يوجد موظفون</td></tr>';
        }
        function openEmpModal() {
            editingEid = null;
            document.getElementById('empModalTitle').textContent = 'إضافة موظف';
            ['eName','ePosition','ePhone','eSalary','eNotes','eHireDate'].forEach(i => document.getElementById(i).value = '');
            document.getElementById('empModal').style.visibility = 'visible';
            document.getElementById('empModal').style.opacity = '1';
        }
        function closeEmpModal() {
            document.getElementById('empModal').style.visibility = 'hidden';
            document.getElementById('empModal').style.opacity = '0';
        }
        async function editEmp(id) {
            const e = await ARDB.getById('employees', id);
            if (!e) return;
            editingEid = id;
            document.getElementById('empModalTitle').textContent = 'تعديل موظف';
            document.getElementById('eName').value = e.name || '';
            document.getElementById('eDept').value = e.departmentId || '';
            document.getElementById('ePosition').value = e.position || '';
            document.getElementById('ePhone').value = e.phone || '';
            document.getElementById('eSalary').value = e.salary || '';
            document.getElementById('eHireDate').value = e.hireDate || '';
            document.getElementById('eNotes').value = e.notes || '';
            document.getElementById('empModal').style.visibility = 'visible';
            document.getElementById('empModal').style.opacity = '1';
        }
        async function saveEmp() {
            const name = document.getElementById('eName').value.trim();
            if (!name) { UI.toast('اسم الموظف مطلوب', 'warn'); return; }
            const rec = {
                name,
                departmentId: document.getElementById('eDept').value ? Number(document.getElementById('eDept').value) : null,
                position: document.getElementById('ePosition').value.trim(),
                phone: document.getElementById('ePhone').value.trim(),
                salary: Number(document.getElementById('eSalary').value) || 0,
                hireDate: document.getElementById('eHireDate').value,
                notes: document.getElementById('eNotes').value.trim(),
                active: true, createdAt: Date.now()
            };
            if (editingEid) { const old = await ARDB.getById('employees', editingEid); rec.active = old ? old.active : true; rec.id = editingEid; await ARDB.put('employees', rec); UI.toast('تم التعديل', 'ok'); }
            else { await ARDB.add('employees', rec); UI.toast('تمت الإضافة', 'ok'); }
            closeEmpModal(); load();
        window.addEventListener('ar_cloud_data_updated', load);
        }
        async function delEmp(id) {
            const ok = await UI.confirmBox('حذف الموظف؟ (لن تُحذف بيانات الحضور والرواتب المرتبطة)');
            if (!ok) return;
            await ARDB.remove('employees', id);
            UI.toast('تم الحذف', 'ok'); load();
        }
        load();
    </script>
</body>
</html>
