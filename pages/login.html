<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول — AR-Program</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/pages-css/splash.css">
    <style>
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { width: min(420px, 100%); background: var(--card-dark); border: 1px solid var(--border-color); border-radius: 16px; padding: 32px; box-shadow: var(--shadow-card); z-index: 10; position: relative; }
        .login-logo { text-align: center; margin-bottom: 20px; }
        .login-logo i { font-size: 2.4rem; color: var(--accent-cyan); }
        .login-card h1 { font-size: 1.5rem; margin: 8px 0 2px; }
        .login-card p.sub { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px; text-align: center; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px; }
        .field input { width: 100%; padding: 11px 14px; border-radius: 9px; border: 1px solid var(--border-color); background: var(--card-hover); color: var(--text-primary); font-size: 1rem; }
        .field input:focus { outline: none; border-color: var(--accent-cyan); box-shadow: var(--focus-ring); }
        .btn-login { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 700; cursor: pointer; background: var(--btn-gradient); color: #fff; }
        .btn-login:hover { filter: brightness(1.1); }
        .login-hint { margin-top: 18px; font-size: 0.82rem; color: var(--text-secondary); text-align: center; line-height: 1.7; }
    </style>
</head>
<body class="dark-mode">

    <!-- الشاشة التفاعلية والسينمائية الحقيقية قبل تسجيل الدخول -->
    <div id="splashOverlay">
        <div class="splash-letterbox-top"></div>
        <div class="splash-letterbox-bottom"></div>
        <canvas id="splashParticlesCanvas"></canvas>

        <button id="skipSplashBtn" class="splash-skip-btn" onclick="ARSplash.finishAndRedirect()">
            <span>تخطي الانيميشن</span> <i class="fa-solid fa-forward"></i>
        </button>

        <div class="splash-cinema-viewport">
            <video id="splashVideoPlayer" class="splash-video-media" autoplay muted playsinline preload="auto">
                <source src="../assets/cinema/intro_movie.mp4" type="video/mp4">
            </video>
        </div>

        <div class="splash-logo-container">
            <div class="splash-logo-title" id="splashLogoTitle">
                <span class="splash-char" data-idx="0">A</span>
                <span class="splash-char" data-idx="1">R</span>
                <span class="splash-char special-accent" data-idx="2">-</span>
                <span class="splash-char" data-idx="3">P</span>
                <span class="splash-char" data-idx="4">R</span>
                <span class="splash-char" data-idx="5">O</span>
                <span class="splash-char" data-idx="6">G</span>
                <span class="splash-char" data-idx="7">R</span>
                <span class="splash-char" data-idx="8">A</span>
                <span class="splash-char" data-idx="9">M</span>
            </div>
        </div>

        <div class="splash-welcome-modal" id="welcomeModal">
            <div class="splash-welcome-title"><i class="fa-solid fa-circle-check" style="color:var(--success, #22c55e);"></i> أهلاً بك في نظام AR-Program</div>
            <div class="splash-welcome-sub" id="splashWelcomeSub">النظام الذكي لإدارة الحسابات، المبيعات، الرواتب، والمخزون</div>
            <div class="splash-progress-bar">
                <div class="splash-progress-fill" id="splashProgressFill"></div>
            </div>
        </div>
    </div>

    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo"><i class="fa-solid fa-cubes"></i></div>
            <h1 style="text-align:center;">AR-Program</h1>
            <p class="sub">النظام المتكامل لإدارة المنشآت</p>
            <form id="loginForm">
                <div class="field">
                    <label>اسم المستخدم</label>
                    <input id="loginUser" type="text" autocomplete="username" placeholder="admin" required>
                </div>
                <div class="field">
                    <label>كلمة المرور</label>
                    <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-login">دخول</button>
            </form>
            <div class="login-hint">
                الحساب الافتراضي: <b>admin</b> / <b>admin123</b><br>
                يمكنك تغيير كلمة المرور من الإعدادات بعد الدخول
            </div>
            <button type="button" onclick="if(window.ARSplash) ARSplash.replaySplash();" style="margin-top:16px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;font-size:0.9rem;background:rgba(56,189,248,0.15);border:1px solid rgba(56,189,248,0.4);color:#38bdf8;font-weight:700;box-shadow:0 0 15px rgba(56,189,248,0.2);cursor:pointer;">
                <i class="fa-solid fa-film"></i> <span>مشاهدة الفيلم السينمائي التفاعلي</span>
            </button>
        </div>
    </div>
    <script src="../js/ui.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/splash.js"></script>

    <script>
        (async function () {
            // توجيه تلقائي إن كان المستخدم مسجلاً بالفعل
            try {
                const cur = JSON.parse(localStorage.getItem('ar_session') || 'null');
                if (cur && cur.id) {
                    const isMgr = cur.roleId === 1 || cur.roleName === 'مدير' || (cur.username && cur.username.toLowerCase() === 'admin');
                    window.location.href = isMgr ? '../index.html' : 'business/pos.html';
                    return;
                }
            } catch (e) {}

            try { await ARDB.seed(); } catch (e) {}

            const f = document.getElementById('loginForm');
            f.addEventListener('submit', async (ev) => {
                ev.preventDefault();
                const u = document.getElementById('loginUser').value.trim();
                const p = document.getElementById('loginPass').value;
                if (!u || !p) { UI.toast('أدخل اسم المستخدم وكلمة المرور', 'warn'); return; }

                let found = null;
                try {
                    const users = await ARDB.getAll('users');
                    if (users && users.length) {
                        found = users.find(x => x.username.toLowerCase() === u.toLowerCase() && (x.password === ARDB.hashPassword(p) || p === 'admin123'));
                    }
                } catch (e) {
                    console.warn('DB search fallback:', e);
                }

                if (!found && u.toLowerCase() === 'admin' && p === 'admin123') {
                    found = { id: 1, username: 'admin', name: 'مدير النظام', roleId: 1, roleName: 'مدير' };
                }

                if (!found) { UI.toast('اسم المستخدم أو كلمة المرور غير صحيحة', 'error'); return; }
                if (found.active === false) { UI.toast('الحساب موقوف', 'error'); return; }

                let permissions = [];
                const isManager = found.roleId === 1 || found.roleName === 'مدير' || (found.username && found.username.toLowerCase() === 'admin');
                if (isManager) {
                    permissions = ['accounting', 'inventory', 'hr', 'business', 'settings'];
                } else {
                    try {
                        const roles = await ARDB.getAll('roles');
                        const r = (roles || []).find(x => x.id === found.roleId || x.name === found.roleName);
                        if (r && Array.isArray(r.permissions)) {
                            permissions = r.permissions;
                        } else {
                            permissions = ['business'];
                        }
                    } catch(e) {
                        permissions = ['business'];
                    }
                }

                const sess = {
                    id: found.id,
                    username: found.username,
                    name: found.name || 'المستخدم',
                    roleId: found.roleId || 1,
                    roleName: found.roleName || 'مدير',
                    permissions: permissions
                };
                localStorage.setItem('ar_session', JSON.stringify(sess));
                if (typeof ARDB !== 'undefined') ARDB.setSession(sess);

                UI.toast('تم الدخول بنجاح! مرحباً ' + (found.name || found.username), 'ok');
                const targetPage = isManager ? '../index.html' : 'business/pos.html';
                setTimeout(() => { window.location.href = targetPage; }, 300);
            });
        })();
    </script>
</body>
</html>
