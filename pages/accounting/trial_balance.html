<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميزان المراجعة — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>
    <main class="pagewrap" style="padding:22px;max-width:1300px;margin:0 auto;">
        <div class="page-head" style="margin-bottom:16px;">
            <div>
                <h2><i class="fa-solid fa-scale-balanced" style="color:var(--accent-cyan);"></i> ميزان المراجعة المحاسبي</h2>
                <div class="sub">مجموع الحركات والأرصدة المدينة والدائنة لكافة الحسابات</div>
            </div>
            <div class="page-actions" style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn btn-secondary" onclick="ARExport.tableToCSV('tbTable', 'ميزان_المراجعة')"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
                <button class="btn btn-secondary" onclick="ARExport.printTable('tbTable', 'ميزان المراجعة المحاسبي')"><i class="fa-solid fa-print"></i> طباعة</button>
            </div>
        </div>

        <!-- شريط الفلاتر والبحث -->
        <div class="table-card" style="padding:14px;margin-bottom:16px;">
            <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;">
                <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
                    <div>
                        <label style="font-size:0.8rem;color:var(--text-secondary);display:block;margin-bottom:4px;">من تاريخ:</label>
                        <input type="date" id="tbFromDate" onchange="load()" style="padding:6px 10px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);font-size:0.85rem;">
                    </div>
                    <div>
                        <label style="font-size:0.8rem;color:var(--text-secondary);display:block;margin-bottom:4px;">إلى تاريخ:</label>
                        <input type="date" id="tbToDate" onchange="load()" style="padding:6px 10px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);font-size:0.85rem;">
                    </div>
                    <div>
                        <label style="font-size:0.8rem;color:var(--text-secondary);display:block;margin-bottom:4px;">بحث:</label>
                        <input type="text" id="tbSearch" placeholder="🔍 ابحث بالحساب أو الكود..." oninput="filterTable()" style="padding:6px 12px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);font-size:0.85rem;width:220px;">
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;margin-top:16px;">
                    <input type="checkbox" id="hideZero" onchange="filterTable()" style="width:16px;height:16px;cursor:pointer;">
                    <label for="hideZero" style="font-size:0.85rem;cursor:pointer;">إخفاء الحسابات ذات الرصيد الصفري</label>
                </div>
            </div>
        </div>

        <div class="table-card">
            <div class="table-head" style="display:flex;justify-content:space-between;align-items:center;">
                <span>جدول ميزان المراجعة</span>
                <span id="tbBalanceStatus"></span>
            </div>
            <div class="table-scroll">
                <table class="data-table" id="tbTable">
                    <thead>
                        <tr>
                            <th>كود الحساب</th>
                            <th>اسم الحساب</th>
                            <th>نوع الحساب</th>
                            <th style="text-align:center;background:rgba(0,162,255,0.08);">مجموع المدين</th>
                            <th style="text-align:center;background:rgba(167,139,250,0.08);">مجموع الدائن</th>
                            <th style="text-align:center;background:rgba(34,197,94,0.08);">رصيد مدين</th>
                            <th style="text-align:center;background:rgba(239,68,68,0.08);">رصيد دائن</th>
                        </tr>
                    </thead>
                    <tbody id="tbBody"></tbody>
                    <tfoot id="tbFoot"></tfoot>
                </table>
            </div>
        </div>
    </main>

    <script src="../../js/ui.js"></script>
    <script src="../../js/db.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        let _allRows = [];

        async function load() {
            try {
                // التأكد من تهيئة شجرة الحسابات والبيانات الافتراضية
                await ARDB.seed();
            } catch(e) {}

            const [accounts, entries, invoices, purchases, invReturns, purReturns, expenses, payments] = await Promise.all([
                ARDB.getAll('accounts'),
                ARDB.getAll('journalEntries'),
                ARDB.getAll('invoices'),
                ARDB.getAll('purchases'),
                ARDB.getAll('invoiceReturns'),
                ARDB.getAll('purchaseReturns'),
                ARDB.getAll('expenses'),
                ARDB.getAll('payments')
            ]);

            const fromStr = document.getElementById('tbFromDate').value;
            const toStr = document.getElementById('tbToDate').value;
            const fromTime = fromStr ? new Date(fromStr + 'T00:00:00').getTime() : 0;
            const toTime = toStr ? new Date(toStr + 'T23:59:59').getTime() : Infinity;

            const totals = {};
            accounts.forEach(a => totals[a.id] = { dr: 0, cr: 0 });

            // 1. تجميع القيود المحاسبية الصريحة
            (entries || []).forEach(en => {
                const date = en.date || 0;
                if (date >= fromTime && date <= toTime) {
                    (en.lines || []).forEach(l => {
                        if (!totals[l.accountId]) totals[l.accountId] = { dr: 0, cr: 0 };
                        totals[l.accountId].dr += (Number(l.debit) || 0);
                        totals[l.accountId].cr += (Number(l.credit) || 0);
                    });
                }
            });

            // 2. تجميع الفواتير إذا لم تكن مسجلة كقيود صريحة
            const hasJournals = entries && entries.length > 0;
            if (!hasJournals) {
                // مبيعات
                (invoices || []).forEach(inv => {
                    const date = inv.date || 0;
                    if (date >= fromTime && date <= toTime && inv.total > 0) {
                        const drAcc = inv.paymentType === 'credit' ? 4 : 3; // 4: عملاء, 3: صندوق
                        const crAcc = 11; // مبيعات
                        if (totals[drAcc]) totals[drAcc].dr += inv.total;
                        if (totals[crAcc]) totals[crAcc].cr += inv.total;
                    }
                });
                // مشتريات
                (purchases || []).forEach(pur => {
                    const date = pur.date || 0;
                    if (date >= fromTime && date <= toTime && pur.total > 0) {
                        const drAcc = 14; // مشتريات
                        const crAcc = pur.paymentType === 'cash' ? 3 : 7; // 3: صندوق, 7: موردون
                        if (totals[drAcc]) totals[drAcc].dr += pur.total;
                        if (totals[crAcc]) totals[crAcc].cr += pur.total;
                    }
                });
                // مصروفات
                (expenses || []).forEach(exp => {
                    const date = exp.date || 0;
                    if (date >= fromTime && date <= toTime && exp.amount > 0) {
                        const drAcc = 13; // مصروفات تشغيلية
                        const crAcc = 3;  // صندوق
                        if (totals[drAcc]) totals[drAcc].dr += exp.amount;
                        if (totals[crAcc]) totals[crAcc].cr += exp.amount;
                    }
                });
            }

            const typeNames = {
                asset: 'أصل',
                liability: 'التزام / خصم',
                equity: 'حقوق ملكية',
                income: 'إيراد',
                expense: 'مصروف'
            };

            _allRows = accounts.map(a => {
                const totDr = totals[a.id] ? totals[a.id].dr : 0;
                const totCr = totals[a.id] ? totals[a.id].cr : 0;
                const netDr = Math.max(totDr - totCr, 0);
                const netCr = Math.max(totCr - totDr, 0);
                return {
                    account: a,
                    totDr,
                    totCr,
                    netDr,
                    netCr,
                    typeName: typeNames[a.type] || a.type || '—'
                };
            }).sort((x, y) => (x.account.code || '').localeCompare(y.account.code || '', 'en'));

            filterTable();
        }

        function filterTable() {
            const query = (document.getElementById('tbSearch').value || '').trim().toLowerCase();
            const hideZero = document.getElementById('hideZero').checked;

            let filtered = _allRows;
            if (query) {
                filtered = filtered.filter(r =>
                    r.account.name.toLowerCase().includes(query) ||
                    r.account.code.toLowerCase().includes(query) ||
                    r.typeName.toLowerCase().includes(query)
                );
            }
            if (hideZero) {
                filtered = filtered.filter(r => r.totDr > 0 || r.totCr > 0 || r.netDr > 0 || r.netCr > 0);
            }

            const sumTotDr = filtered.reduce((s, r) => s + r.totDr, 0);
            const sumTotCr = filtered.reduce((s, r) => s + r.totCr, 0);
            const sumNetDr = filtered.reduce((s, r) => s + r.netDr, 0);
            const sumNetCr = filtered.reduce((s, r) => s + r.netCr, 0);

            const body = document.getElementById('tbBody');
            if (!filtered.length) {
                body.innerHTML = '<tr><td colspan="7" class="empty-state">لا توجد بيانات مطابقة لعرضها</td></tr>';
            } else {
                body.innerHTML = filtered.map(r => `
                    <tr>
                        <td class="num" style="font-weight:700;">${r.account.code}</td>
                        <td style="font-weight:600;">${r.account.name}</td>
                        <td><span class="badge badge-blue" style="font-size:0.75rem;">${r.typeName}</span></td>
                        <td class="num" style="background:rgba(0,162,255,0.03);">${UI.money(r.totDr)}</td>
                        <td class="num" style="background:rgba(167,139,250,0.03);">${UI.money(r.totCr)}</td>
                        <td class="num" style="font-weight:700;color:var(--success);background:rgba(34,197,94,0.03);">${UI.money(r.netDr)}</td>
                        <td class="num" style="font-weight:700;color:var(--danger);background:rgba(239,68,68,0.03);">${UI.money(r.netCr)}</td>
                    </tr>
                `).join('');
            }

            const balanced = Math.abs(sumTotDr - sumTotCr) < 0.01 && Math.abs(sumNetDr - sumNetCr) < 0.01;
            const statusEl = document.getElementById('tbBalanceStatus');
            if (statusEl) {
                statusEl.innerHTML = balanced
                    ? '<span class="badge badge-green" style="font-size:0.85rem;"><i class="fa-solid fa-circle-check"></i> الميزان متوازن</span>'
                    : '<span class="badge badge-red" style="font-size:0.85rem;"><i class="fa-solid fa-triangle-exclamation"></i> غير متوازن (فرق: ' + UI.money(Math.abs(sumNetDr - sumNetCr)) + ')</span>';
            }

            document.getElementById('tbFoot').innerHTML = `
                <tr style="background:var(--card-hover);font-weight:800;font-size:0.95rem;">
                    <td colspan="3">المجموع الكلي</td>
                    <td class="num" style="color:var(--accent-cyan);">${UI.money(sumTotDr)}</td>
                    <td class="num" style="color:var(--accent-purple);">${UI.money(sumTotCr)}</td>
                    <td class="num" style="color:var(--success);">${UI.money(sumNetDr)}</td>
                    <td class="num" style="color:var(--danger);">${UI.money(sumNetCr)}</td>
                </tr>
            `;
        }

        load();
    </script>
</body>
</html>
