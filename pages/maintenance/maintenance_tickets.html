<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أوامر وتذاكر الصيانة — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
        .stat-card { background: var(--card-dark); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 18px; box-shadow: var(--shadow-card); }
        .stat-card .label { font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 4px; }
        .stat-card .value { font-size: 1.4rem; font-weight: 800; color: var(--text-primary); }
        .stat-card .value.cyan { color: var(--accent-cyan); }
        .stat-card .value.purple { color: var(--accent-purple); }
        .stat-card .value.amber { color: var(--warning); }
        .stat-card .value.green { color: var(--success); }

        @media print {
            html, body, body * {
                background: #ffffff !important;
                color: #000000 !important;
                font-weight: 800 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            body > *:not(#thermalPrintArea) { display: none !important; }
            #thermalPrintArea {
                display: block !important;
                position: relative !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 2mm 2mm 25mm 2mm !important;
                box-sizing: border-box !important;
                background: #ffffff !important;
                color: #000000 !important;
                font-family: 'Courier New', monospace !important;
                direction: rtl !important;
                text-align: right !important;
            }
            #thermalPrintArea * { color: #000000 !important; background: transparent !important; }
            @page { size: 80mm auto; margin: 0mm; }
        }
        #thermalPrintArea { display: none; }
    </style>
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>

    <main class="pagewrap" style="padding:22px;max-width:1300px;margin:0 auto;">
        <div class="page-head">
            <div>
                <h2><i class="fa-solid fa-wrench" style="color:var(--accent-cyan);"></i> أوامر وتذاكر الصيانة</h2>
                <div class="sub">استلام وتتبع إصلاح أجهزة العملاء والخدمات الفنية</div>
            </div>
            <div class="page-actions" style="display:flex;gap:8px;">
                <button class="btn btn-secondary" onclick="ARExport.tableToCSV('ticketsTable', 'تذاكر_الصيانة')"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
                <button class="btn btn-primary-soft" onclick="openTicketModal()"><i class="fa-solid fa-plus"></i> تذكرة صيانة جديدة</button>
            </div>
        </div>

        <!-- إحصائيات سريعة -->
        <div class="stat-grid">
            <div class="stat-card"><div class="label">إجمالي التذاكر</div><div class="value cyan" id="stTotalTickets">0</div></div>
            <div class="stat-card"><div class="label">قيد الفحص والإصلاح</div><div class="value amber" id="stPendingTickets">0</div></div>
            <div class="stat-card"><div class="label">جاهز للتسليم</div><div class="value purple" id="stReadyTickets">0</div></div>
            <div class="stat-card"><div class="label">تم التسليم والتحصيل</div><div class="value green" id="stDeliveredTickets">0</div></div>
        </div>

        <div class="table-card">
            <div class="table-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:12px 16px;">
                <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
                    <button class="btn btn-sm btn-secondary active" onclick="filterStatus('all', this)">الكل</button>
                    <button class="btn btn-sm btn-secondary" onclick="filterStatus('pending_inspection', this)">قيد الفحص</button>
                    <button class="btn btn-sm btn-secondary" onclick="filterStatus('in_repair', this)">قيد الإصلاح</button>
                    <button class="btn btn-sm btn-secondary" onclick="filterStatus('ready', this)">جاهز للتسليم</button>
                    <button class="btn btn-sm btn-secondary" onclick="filterStatus('delivered', this)">تم التسليم</button>
                    <button class="btn btn-sm btn-secondary" onclick="filterStatus('rejected', this)">مرفوض/ملغى</button>
                </div>
                <div style="position:relative;width:min(320px,100%);">
                    <i class="fa-solid fa-magnifying-glass" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:0.85rem;"></i>
                    <input type="text" id="ticketSearch" oninput="renderTickets()" placeholder="بحث برقم التذكرة، العميل، نوع الجهاز، السريال..." style="width:100%;padding:6px 30px 6px 10px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);font-size:0.85rem;">
                </div>
            </div>
            <div class="table-scroll">
                <table class="data-table" id="ticketsTable">
                    <thead>
                        <tr>
                            <th>رقم التذكرة</th>
                            <th>التاريخ</th>
                            <th>العميل</th>
                            <th>الجهاز / الموديل</th>
                            <th>السريال S/N</th>
                            <th>وصف العطل</th>
                            <th>التكلفة / العربون</th>
                            <th>الفني</th>
                            <th>الحالة</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="ticketsBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal إنشاء / تعديل تذكرة صيانة -->
    <div id="ticketModal" class="modal-mask" style="visibility:hidden;opacity:0;" onclick="if(event.target===this)closeTicketModal()">
        <div class="modal-box" style="width:min(850px,94vw);">
            <h3 id="ticketModalTitle"><i class="fa-solid fa-wrench" style="color:var(--accent-cyan);"></i> إضافة تذكرة صيانة</h3>
            
            <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));">
                <div class="form-item"><label>التاريخ *</label><input type="date" id="tDate"></div>
                <div class="form-item">
                    <label>العميل *</label>
                    <select id="tCustomer"></select>
                </div>
                <div class="form-item">
                    <label>نوع الجهاز / المعدة *</label>
                    <input id="tDeviceType" placeholder="مثال: لاب توب / هاتف / طابعة / شاشة...">
                </div>
                <div class="form-item">
                    <label>الماركة والموديل</label>
                    <input id="tModel" placeholder="مثال: Dell XPS 15 / iPhone 13 Pro">
                </div>
                <div class="form-item">
                    <label>الرقم التسلسلي (S/N)</label>
                    <input id="tSerial" placeholder="أدخل الرقم التسلسلي للجهاز...">
                </div>
                <div class="form-item">
                    <label>رمز قفل الشاشة (إن وجد)</label>
                    <input id="tPasscode" placeholder="كلمة المرور أو الرمز...">
                </div>
                <div class="form-item" style="grid-column:1/-1;">
                    <label>الملحقات المسلمة مع الجهاز</label>
                    <input id="tAccessories" placeholder="مثال: شاحن أصلي + جراب + كابل...">
                </div>
                <div class="form-item" style="grid-column:1/-1;">
                    <label>وصف العطل / مشكلة العميل *</label>
                    <textarea id="tFault" rows="2" placeholder="اشرح المشكلة بالتفصيل (مثل: الشاشة مكسورة، الجهاز لا يعمل، تجميد...)" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);"></textarea>
                </div>
                <div class="form-item"><label>التكلفة التقديرية (ج.م)</label><input type="number" id="tEstCost" min="0" step="any" placeholder="0.00"></div>
                <div class="form-item"><label>العربون / المدفوع مقدماً (ج.م)</label><input type="number" id="tDeposit" min="0" step="any" placeholder="0.00"></div>
                <div class="form-item"><label>الفني المسؤول</label><select id="tTech"></select></div>
                <div class="form-item">
                    <label>حالة التذكرة</label>
                    <select id="tStatus">
                        <option value="pending_inspection">⏳ قيد الفحص والتخصيص</option>
                        <option value="in_repair">🔧 قيد الإصلاح والعمل</option>
                        <option value="ready">✅ جاهز للتسليم</option>
                        <option value="delivered">🎉 تم التسليم والتحصيل</option>
                        <option value="rejected">❌ مرفوض / غير قابل للإصلاح</option>
                    </select>
                </div>
                <div class="form-item" style="grid-column:1/-1;">
                    <label>تقرير الفحص والملاحظات الفنية</label>
                    <input id="tTechNotes" placeholder="ملاحظات المهندس / الفني عن الإصلاح وقيم قطع الغيار...">
                </div>
            </div>

            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
                <button class="btn btn-secondary" onclick="closeTicketModal()">إلغاء</button>
                <button class="btn btn-primary-soft" onclick="saveTicket()">حفظ التذكرة</button>
            </div>
        </div>
    </div>

    <script src="../../js/ui.js"></script>
    <script src="../../js/db.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        let _tickets = [];
        let _customers = [];
        let _employees = [];
        let _custById = {};
        let _empById = {};
        let editingTicketId = null;
        let selectedStatusFilter = 'all';

        async function load() {
            const [tickets, customers, employees] = await Promise.all([
                ARDB.getAll('maintenanceTickets'),
                ARDB.getAll('customers'),
                ARDB.getAll('employees')
            ]);
            _tickets = tickets || [];
            _customers = customers || [];
            _employees = employees || [];

            _custById = {}; _customers.forEach(c => _custById[c.id] = c);
            _empById = {}; _employees.forEach(e => _empById[e.id] = e);

            const cSel = document.getElementById('tCustomer');
            cSel.innerHTML = '<option value="">— اختر العميل —</option>' + _customers.map(c => `<option value="${c.id}">${c.name} ${c.phone ? '(' + c.phone + ')' : ''}</option>`).join('');

            const eSel = document.getElementById('tTech');
            eSel.innerHTML = '<option value="">— اختر الفني —</option>' + _employees.map(e => `<option value="${e.id}">${e.name}</option>`).join('');

            renderKPIs();
            renderTickets();
        }

        function renderKPIs() {
            const total = _tickets.length;
            const pending = _tickets.filter(t => t.status === 'pending_inspection' || t.status === 'in_repair').length;
            const ready = _tickets.filter(t => t.status === 'ready').length;
            const delivered = _tickets.filter(t => t.status === 'delivered').length;

            document.getElementById('stTotalTickets').textContent = total;
            document.getElementById('stPendingTickets').textContent = pending;
            document.getElementById('stReadyTickets').textContent = ready;
            document.getElementById('stDeliveredTickets').textContent = delivered;
        }

        function filterStatus(st, btn) {
            selectedStatusFilter = st;
            const btns = btn.parentElement.querySelectorAll('button');
            btns.forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderTickets();
        }

        function renderTickets() {
            const q = (document.getElementById('ticketSearch').value || '').trim().toLowerCase();
            let filtered = _tickets;

            if (selectedStatusFilter !== 'all') {
                filtered = filtered.filter(t => t.status === selectedStatusFilter);
            }

            if (q) {
                filtered = filtered.filter(t => {
                    const num = String(t.number || '').toLowerCase();
                    const custName = (t.customerId && _custById[t.customerId] ? _custById[t.customerId].name : '').toLowerCase();
                    const device = String(t.deviceType || '').toLowerCase();
                    const model = String(t.model || '').toLowerCase();
                    const serial = String(t.serialNumber || '').toLowerCase();
                    const fault = String(t.faultDescription || '').toLowerCase();

                    return num.includes(queryClean(q)) || custName.includes(q) || device.includes(q) || model.includes(q) || serial.includes(q) || fault.includes(q);
                });
            }

            filtered.sort((a, b) => (b.date || 0) - (a.date || 0));

            const body = document.getElementById('ticketsBody');
            if (!filtered.length) {
                body.innerHTML = '<tr><td colspan="10" class="empty-state">لا توجد تذاكر صيانة مطابقة للبحث</td></tr>';
                return;
            }

            body.innerHTML = filtered.map(t => {
                const custName = t.customerId && _custById[t.customerId] ? _custById[t.customerId].name : 'عميل غير مسجل';
                const techName = t.techId && _empById[t.techId] ? _empById[t.techId].name : '—';
                const stBadge = getStatusBadge(t.status);

                return `<tr>
                    <td class="num" style="font-weight:700;"><i class="fa-solid fa-wrench" style="color:var(--accent-cyan);font-size:0.8rem;margin-inline-end:4px;"></i>${t.number || ('TR-' + t.id)}</td>
                    <td>${UI.date(t.date)}</td>
                    <td><b>${custName}</b></td>
                    <td>${t.deviceType || '—'} <span style="font-size:0.75rem;color:var(--text-secondary);">${t.model ? '(' + t.model + ')' : ''}</span></td>
                    <td class="num" style="font-size:0.82rem;">${t.serialNumber || '—'}</td>
                    <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${t.faultDescription || ''}">${t.faultDescription || '—'}</td>
                    <td class="num">
                        <span style="color:var(--success);font-weight:700;">${UI.money(t.estimatedCost || 0)}</span>
                        ${t.deposit ? '<div style="font-size:0.72rem;color:var(--warning);">عربون: ' + UI.money(t.deposit) + '</div>' : ''}
                    </td>
                    <td>${techName}</td>
                    <td>${stBadge}</td>
                    <td style="text-align:left;white-space:nowrap;">
                        <button class="btn btn-sm btn-secondary" onclick="printTicketThermal('${t.id}')" title="طباعة إيصال استلام حراري 80mm"><i class="fa-solid fa-print"></i> إيصال</button>
                        ${t.status !== 'delivered' ? '<button class="btn btn-sm btn-primary-soft" onclick="convertTicketToInvoice(\'' + t.id + '\')" title="تحويل لفاتورة وتسديد"><i class="fa-solid fa-file-invoice-dollar"></i></button> ' : ''}
                        <button class="btn btn-sm" onclick="editTicket('${t.id}')" title="تعديل"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="delTicket('${t.id}')" title="حذف"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
        }

        function queryClean(str) { return str.replace(/[^a-z0-9\u0600-\u06FF]/g, ''); }

        function getStatusBadge(st) {
            switch (st) {
                case 'pending_inspection': return '<span class="badge badge-amber"><i class="fa-solid fa-hourglass-start"></i> قيد الفحص</span>';
                case 'in_repair': return '<span class="badge badge-purple"><i class="fa-solid fa-screwdriver-wrench"></i> قيد الإصلاح</span>';
                case 'ready': return '<span class="badge badge-blue"><i class="fa-solid fa-circle-check"></i> جاهز للتسليم</span>';
                case 'delivered': return '<span class="badge badge-green"><i class="fa-solid fa-box-check"></i> تم التسليم</span>';
                case 'rejected': return '<span class="badge badge-red"><i class="fa-solid fa-ban"></i> مرفوض/ملغى</span>';
                default: return '<span class="badge badge-secondary">—</span>';
            }
        }

        function openTicketModal() {
            editingTicketId = null;
            document.getElementById('ticketModalTitle').innerHTML = '<i class="fa-solid fa-wrench" style="color:var(--accent-cyan);"></i> إضافة تذكرة صيانة جديدة';
            document.getElementById('tDate').value = UI.todayInput();
            ['tDeviceType','tModel','tSerial','tPasscode','tAccessories','tFault','tEstCost','tDeposit','tTechNotes'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('tCustomer').value = '';
            document.getElementById('tTech').value = '';
            document.getElementById('tStatus').value = 'pending_inspection';

            document.getElementById('ticketModal').style.visibility = 'visible';
            document.getElementById('ticketModal').style.opacity = '1';
        }

        function closeTicketModal() {
            document.getElementById('ticketModal').style.visibility = 'hidden';
            document.getElementById('ticketModal').style.opacity = '0';
        }

        async function editTicket(id) {
            let t = await ARDB.getById('maintenanceTickets', id);
            if (!t) {
                const all = await ARDB.getAll('maintenanceTickets');
                t = all.find(x => String(x.id) === String(id));
            }
            if (!t) return UI.toast('تعذر العثور على التذكرة', 'warn');

            editingTicketId = t.id;
            document.getElementById('ticketModalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square" style="color:var(--accent-cyan);"></i> تعديل تذكرة صيانة: ' + (t.number || t.id);
            document.getElementById('tDate').value = t.date ? UI.todayInput(new Date(t.date)) : UI.todayInput();
            document.getElementById('tCustomer').value = t.customerId || '';
            document.getElementById('tDeviceType').value = t.deviceType || '';
            document.getElementById('tModel').value = t.model || '';
            document.getElementById('tSerial').value = t.serialNumber || '';
            document.getElementById('tPasscode').value = t.passcode || '';
            document.getElementById('tAccessories').value = t.accessories || '';
            document.getElementById('tFault').value = t.faultDescription || '';
            document.getElementById('tEstCost').value = t.estimatedCost || '';
            document.getElementById('tDeposit').value = t.deposit || '';
            document.getElementById('tTech').value = t.techId || '';
            document.getElementById('tStatus').value = t.status || 'pending_inspection';
            document.getElementById('tTechNotes').value = t.techNotes || '';

            document.getElementById('ticketModal').style.visibility = 'visible';
            document.getElementById('ticketModal').style.opacity = '1';
        }

        async function saveTicket() {
            const dateVal = document.getElementById('tDate').value;
            const date = dateVal ? new Date(dateVal + 'T12:00:00').getTime() : Date.now();
            const customerId = document.getElementById('tCustomer').value || null;
            const deviceType = document.getElementById('tDeviceType').value.trim();
            const faultDescription = document.getElementById('tFault').value.trim();

            if (!customerId) return UI.toast('يرجى اختيار العميل', 'warn');
            if (!deviceType) return UI.toast('يرجى إدخال نوع الجهاز', 'warn');
            if (!faultDescription) return UI.toast('يرجى إدخال وصف العطل', 'warn');

            const rec = {
                date,
                customerId,
                deviceType,
                model: document.getElementById('tModel').value.trim(),
                serialNumber: document.getElementById('tSerial').value.trim(),
                passcode: document.getElementById('tPasscode').value.trim(),
                accessories: document.getElementById('tAccessories').value.trim(),
                faultDescription,
                estimatedCost: Number(document.getElementById('tEstCost').value) || 0,
                deposit: Number(document.getElementById('tDeposit').value) || 0,
                techId: document.getElementById('tTech').value || null,
                status: document.getElementById('tStatus').value,
                techNotes: document.getElementById('tTechNotes').value.trim(),
                updatedAt: Date.now()
            };

            if (editingTicketId) {
                rec.id = editingTicketId;
                await ARDB.put('maintenanceTickets', rec);
                UI.toast('تم تحديث بيانات التذكرة', 'ok');
            } else {
                rec.number = await ARDB.nextSeq('maintenanceTicket', 'TR-', 6);
                rec.createdAt = Date.now();
                await ARDB.add('maintenanceTickets', rec);
                UI.toast('تم إنشاء تذكرة الصيانة ' + rec.number, 'ok');
            }

            closeTicketModal();
            load();
        }

        async function convertTicketToInvoice(id) {
            let t = await ARDB.getById('maintenanceTickets', id);
            if (!t) {
                const all = await ARDB.getAll('maintenanceTickets');
                t = all.find(x => String(x.id) === String(id));
            }
            if (!t) return;

            const finalCostStr = prompt(`أدخل القيمة الإجمالية لإصلاح الجهاز (${t.deviceType}):`, t.estimatedCost || 0);
            if (finalCostStr === null) return;
            const finalCost = parseFloat(finalCostStr);
            if (isNaN(finalCost) || finalCost <= 0) return UI.toast('مبلغ غير صالح', 'warn');

            const remaining = Math.max(0, finalCost - (t.deposit || 0));

            const invNumber = await ARDB.nextSeq('invoice', 'INV-', 6);
            const invItems = [{
                productId: 'service_repair',
                name: 'خدمة صيانة وإصلاح جهاز: ' + t.deviceType + (t.model ? ' (' + t.model + ')' : ''),
                quantity: 1,
                price: finalCost,
                cost: 0,
                total: finalCost
            }];

            const invId = await ARDB.add('invoices', {
                number: invNumber,
                date: Date.now(),
                customerId: t.customerId,
                paymentType: 'cash',
                items: invItems,
                subtotal: finalCost,
                total: finalCost,
                note: 'خدمة صيانة بموجب التذكرة ' + (t.number || t.id),
                createdAt: Date.now()
            });

            // تحديث حالة التذكرة لتم التسليم
            await ARDB.update('maintenanceTickets', t.id, {
                status: 'delivered',
                invoiceId: invId,
                invoiceNumber: invNumber,
                updatedAt: Date.now()
            });

            // تسديد وتثبيت الإيراد المحاسبي
            await ARDB.add('journalEntries', {
                number: await ARDB.nextSeq('journalAuto', 'JRN-', 6),
                date: Date.now(),
                desc: 'إيراد صيانة وإصلاح جهاز فاتورة ' + invNumber,
                lines: [
                    { accountId: 3, debit: finalCost, credit: 0 },
                    { accountId: 11, debit: 0, credit: finalCost }
                ]
            });

            UI.toast('تم إصدار فاتورة الصيانة وتسديد الحساب بنجاح برقم: ' + invNumber, 'ok');
            load();
        }

        async function printTicketThermal(id) {
            let t = await ARDB.getById('maintenanceTickets', id);
            if (!t) {
                const all = await ARDB.getAll('maintenanceTickets');
                t = all.find(x => String(x.id) === String(id));
            }
            if (!t) return;

            const [settings, customers, employees] = await Promise.all([
                ARDB.getAll('settings'),
                ARDB.getAll('customers'),
                ARDB.getAll('employees')
            ]);

            const s = {}; (settings || []).forEach(r => { if (r && r.key) s[r.key] = r.value; });
            const cust = t.customerId ? (customers || []).find(c => String(c.id) === String(t.customerId)) : null;
            const tech = t.techId ? (employees || []).find(e => String(e.id) === String(t.techId)) : null;

            const compName = s.companyName || 'AR-Program';
            const compPhone = s.companyPhone || '';
            const compAddress = s.companyAddress || '';

            const custName = cust ? cust.name : 'عميل غير مسجل';
            const custPhone = cust && cust.phone ? cust.phone : '';

            const receiptHtml = `
                <div style="font-family:'Courier New', monospace;font-size:10px;font-weight:800;color:#000000;line-height:1.3;direction:rtl;text-align:right;width:100%;box-sizing:border-box;background:#ffffff;padding:1px;">
                    <div style="text-align:center;padding-bottom:4px;margin-bottom:4px;border-bottom:2px solid #000000;">
                        <div style="font-size:13px;font-weight:900;margin-bottom:2px;">${compName}</div>
                        ${compAddress ? `<div style="font-size:9px;">📍 ${compAddress}</div>` : ''}
                        ${compPhone ? `<div style="font-size:9px;">📞 ${compPhone}</div>` : ''}
                        <div style="font-size:11px;font-weight:900;margin-top:4px;padding:2px 0;border:1.5px solid #000000;">إيصال استلام جهاز صيانة</div>
                    </div>

                    <table style="width:100%;font-size:9.5px;margin-bottom:4px;border-collapse:collapse;">
                        <tr><td><b>رقم التذكرة:</b> ${t.number || ('TR-' + t.id)}</td></tr>
                        <tr><td><b>التاريخ:</b> ${UI.datetime(t.date)}</td></tr>
                        <tr><td><b>العميل:</b> ${custName} ${custPhone ? '(' + custPhone + ')' : ''}</td></tr>
                        <tr><td><b>نوع الجهاز:</b> ${t.deviceType || '—'}</td></tr>
                        <tr><td><b>الماركة والموديل:</b> ${t.model || '—'}</td></tr>
                        <tr><td><b>الرقم التسلسلي S/N:</b> ${t.serialNumber || '—'}</td></tr>
                        ${t.passcode ? `<tr><td><b>رمز القفل:</b> ${t.passcode}</td></tr>` : ''}
                        ${t.accessories ? `<tr><td><b>الملحقات:</b> ${t.accessories}</td></tr>` : ''}
                    </table>

                    <div style="border-top:1.5px solid #000000;margin:4px 0;"></div>

                    <div style="margin-bottom:4px;font-size:9.5px;">
                        <div style="font-weight:900;margin-bottom:2px;">وصف العطل والخدمة المطلوبة:</div>
                        <div style="font-size:9px;background:#f8fafc;padding:3px;border:1px dashed #000;">${t.faultDescription || '—'}</div>
                    </div>

                    <table style="width:100%;font-size:10px;margin-bottom:4px;border-top:1.5px solid #000;padding-top:4px;">
                        <tr>
                            <td>التكلفة التقديرية:</td>
                            <td style="text-align:left;font-weight:900;">${UI.money(t.estimatedCost || 0)} ج.م</td>
                        </tr>
                        ${t.deposit > 0 ? `
                        <tr>
                            <td>العربون المدفوع:</td>
                            <td style="text-align:left;font-weight:900;">-${UI.money(t.deposit)} ج.م</td>
                        </tr>
                        ` : ''}
                    </table>

                    <div style="text-align:center;font-size:8.5px;margin-top:6px;padding-top:4px;border-top:1.5px dashed #000000;">
                        <div>يرجى إبراز هذا الإيصال عند استلام الجهاز بعد الإصلاح</div>
                        <div>المركز غير مسؤول عن الأجهزة بعد مرور 30 يوماً من جاهزيتها</div>
                        <div style="margin-top:4px;font-weight:900;font-size:10px;">* ${t.number || t.id} *</div>
                    </div>
                </div>
            `;

            let area = document.getElementById('thermalPrintArea');
            if (!area) {
                area = document.createElement('div');
                area.id = 'thermalPrintArea';
                document.body.appendChild(area);
            }
            area.innerHTML = receiptHtml;

            setTimeout(() => {
                try {
                    window.print();
                } catch(e) {
                    const win = window.open('', '_blank', 'width=380,height=600');
                    if (win) {
                        win.document.write('<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>إيصال صيانة</title></head><body>' + receiptHtml + '<script>window.onload=function(){window.print();};<\/script></body></html>');
                        win.document.close();
                    }
                }
            }, 150);
        }

        async function delTicket(id) {
            const ok = await UI.confirmBox('هل أنت تأكد من حذف تذكرة الصيانة هذه؟');
            if (!ok) return;
            await ARDB.remove('maintenanceTickets', id);
            UI.toast('تم الحذف', 'ok');
            load();
        }

        load();
        window.addEventListener('ar_cloud_data_updated', load);
    </script>
    <div id="thermalPrintArea"></div>
</body>
</html>
