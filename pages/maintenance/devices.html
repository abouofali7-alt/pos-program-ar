<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صيانة ومعدات المنشأة — AR-Program</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/app.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="dark-mode">
    <div id="appHeaderHost"></div>

    <main class="pagewrap" style="padding:22px;max-width:1200px;margin:0 auto;">
        <div class="page-head">
            <div>
                <h2><i class="fa-solid fa-gears" style="color:var(--accent-purple);"></i> صيانة ومعدات المنشأة</h2>
                <div class="sub">تتبع معدات الشركة وأجهزة الكاشير وتاريخ الصيانة الدورية</div>
            </div>
            <div class="page-actions" style="display:flex;gap:8px;">
                <button class="btn btn-secondary" onclick="ARExport.tableToCSV('devicesTable', 'معدات_المنشأة')"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
                <button class="btn btn-primary-soft" onclick="openDeviceModal()"><i class="fa-solid fa-plus"></i> إضافة معدة / جهاز جديد</button>
            </div>
        </div>

        <div class="table-card">
            <div class="table-head">سجل معدات وأجهزة المنشأة</div>
            <div class="table-scroll">
                <table class="data-table" id="devicesTable">
                    <thead>
                        <tr>
                            <th>اسم المعدة / الجهاز</th>
                            <th>القسم / الموقع</th>
                            <th>السريال S/N</th>
                            <th>تاريخ الصيانة الأخيرة</th>
                            <th>تاريخ الصيانة القادمة</th>
                            <th>الحالة التشغيلية</th>
                            <th>التكلفة الإجمالية للصيانة</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="devicesBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal إضافة / تعديل معدة -->
    <div id="deviceModal" class="modal-mask" style="visibility:hidden;opacity:0;" onclick="if(event.target===this)closeDeviceModal()">
        <div class="modal-box" style="width:min(680px,94vw);">
            <h3 id="deviceModalTitle">إضافة معدة / جهاز للمنشأة</h3>
            <div class="form-grid">
                <div class="form-item"><label>اسم المعدة / الجهاز *</label><input id="dName" placeholder="مثال: طابعة فواتير كاشير / جهاز تكييف المحل"></div>
                <div class="form-item"><label>القسم / الموقع</label><input id="dLocation" placeholder="مثال: الكاشير / الفرع الرئيسي / ورشة العمل"></div>
                <div class="form-item"><label>الرقم التسلسلي (S/N)</label><input id="dSerial" placeholder="S/N..."></div>
                <div class="form-item"><label>تاريخ آخر صيانة</label><input type="date" id="dLastDate"></div>
                <div class="form-item"><label>تاريخ الصيانة القادمة</label><input type="date" id="dNextDate"></div>
                <div class="form-item"><label>تكلفة الصيانة الأخيرة (ج.م)</label><input type="number" id="dCost" min="0" step="any" placeholder="0.00"></div>
                <div class="form-item" style="grid-column:1/-1;">
                    <label>الحالة التشغيلية</label>
                    <select id="dStatus">
                        <option value="working">🟢 تعمل بكفاءة (ممتازة)</option>
                        <option value="needs_maintenance">🟡 تحتاج صيانة دورية قريبًا</option>
                        <option value="under_repair">🟣 تحت الصيانة حالياً</option>
                        <option value="out_of_service">🔴 خارج الخدمة / معطلة</option>
                    </select>
                </div>
                <div class="form-item" style="grid-column:1/-1;">
                    <label>ملاحظات وسجل الأعطال</label>
                    <textarea id="dNotes" rows="2" placeholder="أدخل تفاصيل وملاحظات الصيانة والقطع المستبدلة..." style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-hover);color:var(--text-primary);"></textarea>
                </div>
            </div>
            <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px;">
                <button class="btn btn-secondary" onclick="closeDeviceModal()">إلغاء</button>
                <button class="btn btn-primary-soft" onclick="saveDevice()">حفظ</button>
            </div>
        </div>
    </div>

    <script src="../../js/ui.js"></script>
    <script src="../../js/db.js"></script>
    <script src="../../js/export.js"></script>
    <script src="../../js/app.js"></script>
    <script>
        let _devices = [];
        let editingDeviceId = null;

        async function load() {
            _devices = (await ARDB.getAll('maintenanceDevices')) || [];
            const body = document.getElementById('devicesBody');

            if (!_devices.length) {
                body.innerHTML = '<tr><td colspan="8" class="empty-state">لا توجد معدات أو أجهزة مسجلة للمنشأة</td></tr>';
                return;
            }

            body.innerHTML = _devices.map(d => {
                let stBadge = '<span class="badge badge-green">تعمل بكفاءة</span>';
                if (d.status === 'needs_maintenance') stBadge = '<span class="badge badge-amber">تحتاج صيانة قريبًا</span>';
                else if (d.status === 'under_repair') stBadge = '<span class="badge badge-purple">تحت الصيانة</span>';
                else if (d.status === 'out_of_service') stBadge = '<span class="badge badge-red">خارج الخدمة</span>';

                return `<tr>
                    <td><b>${d.name}</b></td>
                    <td>${d.location || '—'}</td>
                    <td class="num" style="font-size:0.82rem;">${d.serialNumber || '—'}</td>
                    <td>${d.lastMaintenanceDate ? UI.date(d.lastMaintenanceDate) : '—'}</td>
                    <td>${d.nextMaintenanceDate ? UI.date(d.nextMaintenanceDate) : '—'}</td>
                    <td>${stBadge}</td>
                    <td class="num" style="font-weight:700;">${UI.money(d.cost || 0)}</td>
                    <td style="text-align:left;">
                        <button class="btn btn-sm" onclick="editDevice('${d.id}')"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="delDevice('${d.id}')"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
        }

        function openDeviceModal() {
            editingDeviceId = null;
            document.getElementById('deviceModalTitle').textContent = 'إضافة معدة / جهاز جديد للمنشأة';
            ['dName','dLocation','dSerial','dLastDate','dNextDate','dCost','dNotes'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('dStatus').value = 'working';
            document.getElementById('deviceModal').style.visibility = 'visible';
            document.getElementById('deviceModal').style.opacity = '1';
        }

        function closeDeviceModal() {
            document.getElementById('deviceModal').style.visibility = 'hidden';
            document.getElementById('deviceModal').style.opacity = '0';
        }

        async function editDevice(id) {
            let d = await ARDB.getById('maintenanceDevices', id);
            if (!d) {
                const all = await ARDB.getAll('maintenanceDevices');
                d = all.find(x => String(x.id) === String(id));
            }
            if (!d) return;

            editingDeviceId = d.id;
            document.getElementById('deviceModalTitle').textContent = 'تعديل بيانات معدة: ' + d.name;
            document.getElementById('dName').value = d.name || '';
            document.getElementById('dLocation').value = d.location || '';
            document.getElementById('dSerial').value = d.serialNumber || '';
            document.getElementById('dLastDate').value = d.lastMaintenanceDate ? UI.todayInput(new Date(d.lastMaintenanceDate)) : '';
            document.getElementById('dNextDate').value = d.nextMaintenanceDate ? UI.todayInput(new Date(d.nextMaintenanceDate)) : '';
            document.getElementById('dCost').value = d.cost || '';
            document.getElementById('dStatus').value = d.status || 'working';
            document.getElementById('dNotes').value = d.notes || '';

            document.getElementById('deviceModal').style.visibility = 'visible';
            document.getElementById('deviceModal').style.opacity = '1';
        }

        async function saveDevice() {
            const name = document.getElementById('dName').value.trim();
            if (!name) return UI.toast('اسم المعدة مطلوب', 'warn');

            const lastDateVal = document.getElementById('dLastDate').value;
            const nextDateVal = document.getElementById('dNextDate').value;

            const rec = {
                name,
                location: document.getElementById('dLocation').value.trim(),
                serialNumber: document.getElementById('dSerial').value.trim(),
                lastMaintenanceDate: lastDateVal ? new Date(lastDateVal + 'T12:00:00').getTime() : null,
                nextMaintenanceDate: nextDateVal ? new Date(nextDateVal + 'T12:00:00').getTime() : null,
                cost: Number(document.getElementById('dCost').value) || 0,
                status: document.getElementById('dStatus').value,
                notes: document.getElementById('dNotes').value.trim(),
                updatedAt: Date.now()
            };

            if (editingDeviceId) {
                rec.id = editingDeviceId;
                await ARDB.put('maintenanceDevices', rec);
                UI.toast('تم الحفظ والتحديث', 'ok');
            } else {
                rec.createdAt = Date.now();
                await ARDB.add('maintenanceDevices', rec);
                UI.toast('تمت إضافتها بنجاح', 'ok');
            }

            closeDeviceModal();
            load();
        }

        async function delDevice(id) {
            const ok = await UI.confirmBox('حذف هذه المعدة من السجل؟');
            if (!ok) return;
            await ARDB.remove('maintenanceDevices', id);
            UI.toast('تم الحذف', 'ok');
            load();
        }

        load();
        window.addEventListener('ar_cloud_data_updated', load);
    </script>
</body>
</html>
